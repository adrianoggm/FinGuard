    direction: INCOME
    dateRange: {from: 2026-06-01, to: 2026-06-30}
  expected: {totalMinor: 251617, movementCount: 3}

# Con los dos sentidos mezclados el total es el neto: 251617 - 208140.
- id: neto_junio
  question: ¿Cuánto ahorré en junio?
  account: ES-0001
  plan:
    direction: ALL
    dateRange: {from: 2026-06-01, to: 2026-06-30}
  expected: {totalMinor: 43477, movementCount: 31}

- id: gasolina_julio_por_semana
  question: Compara mi gasto en gasolina de este mes por semanas
  account: ES-0001
  plan:
    direction: EXPENSE
    categories: [TRANSPORT_FUEL]
    dateRange: {from: 2026-07-01, to: 2026-07-31}
    groupBy: WEEK
  expected:
    totalMinor: 15946
    movementCount: 3
    groups:
      - {key: "2026-07-06", totalMinor: 7009, movementCount: 1}
      - {key: "2026-07-13", totalMinor: 4098, movementCount: 1}
      - {key: "2026-07-20", totalMinor: 4839, movementCount: 1}

