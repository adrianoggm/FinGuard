# Dataset de evaluación del motor de consultas (Fase 2).
#
# Cada caso es un plan como el que emitirá el LLM, y lo que el motor debe devolver
# sobre seeds/0001_demo.sql. Las cifras esperadas NO salen del motor: se calcularon
# con evaluation/expected.sql, SQL escrito aparte, sobre las tablas y con las fechas
# explícitas. Si salieran del propio motor, esto no mediría nada.
#
# `question` no se usa todavía: es el texto con el que se medirá la exactitud de
# interpretación cuando el asistente traduzca lenguaje natural a plan (Fase 3).
#
# Los casos con periodo relativo fijan `reference`: sin eso el resultado cambiaría
# cada día y esto dejaría de ser una medida.

- id: gasolina_julio
  question: ¿Cuánto he gastado en gasolina este mes?
  account: ES-0001
  plan:
    direction: EXPENSE
    categories: [TRANSPORT_FUEL]
    dateRange: {from: 2026-07-01, to: 2026-07-31}
  expected: {totalMinor: 15946, movementCount: 3}

- id: gasolina_mes_pasado
  question: ¿Y cuánto gasté el mes anterior?
  account: ES-0001
  plan:
    direction: EXPENSE
    categories: [TRANSPORT_FUEL]
    period: {period: LAST_MONTH, reference: 2026-07-15}
  expected: {totalMinor: 10280, movementCount: 2}

- id: supermercado_tres_meses
  question: ¿Cuánto llevo gastado en supermercado en los últimos tres meses?
  account: ES-0001
  plan:
    direction: EXPENSE
    categories: [GROCERIES]
    period: {period: LAST_N_MONTHS, n: 3, reference: 2026-07-15}
  expected: {totalMinor: 132149, movementCount: 23}

- id: gasto_total_junio
  question: ¿Cuánto gasté en total en junio?
  account: ES-0001
