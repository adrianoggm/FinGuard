[project]
name = "finguard-banking-api"
version = "0.1.0"
description = "Núcleo financiero determinista de FinGuard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "asyncpg>=0.30",
    "pydantic-settings>=2.7",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    # Base de datos de zonas horarias. Windows no trae ninguna y las imágenes slim
    # tampoco la garantizan: sin esto, ZoneInfo("Europe/Madrid") falla según la máquina.
    "tzdata>=2025.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # Not a typosquat, and here is how to check it rather than take our word:
    #   uv run python -c "import importlib.metadata as m; print(m.requires('starlette'))"
    # prints httpx2>=2.0.0 for the 'full' extra — the requirement is starlette's own,
    # not ours, and its testclient does `import httpx2 as httpx`. The package is
    # github.com/pydantic/httpx2, pinned here by sha256 in uv.lock and installed with
    # --frozen. Swapping it for httpx contradicts starlette and takes the deprecated
    # path, so automated scanners flagging the name are wrong on this one.
    "httpx2>=2.9",
    "ruff>=0.9",
    "mypy>=1.14",
    "asyncpg-stubs>=0.31",
    "pytest-asyncio>=0.25",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finguard_banking"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E and W are pycodestyle, N is pep8-naming: PEP 8 enforced, not assumed.
# Measured but not enabled yet: D (pydocstyle) costs 233 docstrings across both
# services, S (flake8-bandit) 95 findings dominated by asserts in tests.
select = ["E", "W", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
# Without the plugin, mypy expects the contract aliases ("from", "to") in the
# constructor instead of the field names, and populate_by_name goes unnoticed.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running PostgreSQL"]
asyncio_mode = "auto"
