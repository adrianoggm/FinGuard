[project]
name = "finguard-simulated-gym"
version = "0.1.0"
description = "A simulated third-party gym agent (A2A 1.0) used to demo and test FinGuard's A2A consumption"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[fastapi]>=1.2.1,<2",
    "fastapi>=0.115",
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28", "ruff>=0.9", "mypy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finguard_simulated_gym"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
