[project]
name = "finguard-orchestrator"
version = "0.1.0"
description = "Conversational orchestrator of FinGuard"
requires-python = ">=3.12"
dependencies = [
    # The holder's zone decides which day a purchase belongs to, and python-slim ships no
    # tz database: without this, ZoneInfo("Europe/Madrid") raises in the container while
    # working on a developer's machine. banking already depends on it for the same reason.
    "tzdata>=2025.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    # Runtime, not just tests: the Ollama provider and the banking client speak HTTP.
    # See tests/test_dependency_provenance.py for why the name is not a typosquat.
    "httpx2>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    # Not a typosquat of httpx: it is what starlette>=1.3 declares for its testclient.
    # Asserted in tests/test_dependency_provenance.py, which also fails if the lock
    # stops pinning it by sha256 from PyPI. Read that, not this.
    "httpx2>=2.9",
    "ruff>=0.9",
    "mypy>=1.14",
    # The evaluation dataset is YAML.
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finguard_orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E and W are pycodestyle, N is pep8-naming: PEP 8 enforced, not assumed.
# Measured but not enabled yet: D (pydocstyle) costs 233 docstrings across both
# services, S (flake8-bandit) 95 findings dominated by asserts in tests.
select = ["E", "W", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# This service has no database. What it needs is a local Ollama daemon, which CI
# does not have, so the marker names that instead of inheriting banking-api's wording.
markers = ["integration: needs a running Ollama daemon"]
asyncio_mode = "auto"
