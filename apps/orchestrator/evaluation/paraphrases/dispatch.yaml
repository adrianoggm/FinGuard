      - "Quiero ver mis tarjetas y el gasto total de cada una, por favor."
      - "Tengo varias tarjetas, ¿podrías decirme cuánto he gastado con cada una de ellas?"
      - "Me interesa conocer el detalle de mis tarjetas y los gastos asociados a cada una."
      - "¿Puedes decirme qué tarjetas tengo activas y cuánto se ha gastado con cada una, por favor?"
      - "Estoy intentando hacer un seguimiento de mis gastos, ¿qué tarjetas tengo y cuánto he gastado con cada una?"
      - "Quiero saber mis tarjtas y cuantp he gastado con cada una, gracias."
