      - "Estoy intentando enviar dinero a alguien de mi lista de contactos, ¿a quién puedo enviarlo?"
      - "Necesito saber qué contactos de mi agenda están disponibles para recibir dinero que yo les envíe."
      - "Quieo saber a quien de mi agend puedo envirles dinreo."
      - "¿Puedo tener una lista de las personas de mi agenda a las que puedo hacer una transferencia de dinero?"
      - "Estoy tratando de enviarle dinero a alguien, ¿puedo saber a quie de mi agenda puedo hacerlo?"

