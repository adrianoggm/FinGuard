# The same question, said the way somebody else says it.
#
# Every sentence in a group means the same thing, so every one of them has to reach the same place.
# What this measures is not accuracy but *robustness*: how far a sentence can drift from the ones
# this service was built against before dispatch stops working.
#
# The complaint it exists to put a number on: "anything slightly different from what was tested
# does not work well, which makes it fragile". Until this file, nothing here could say whether that
# was true.
#
# --- where the sentences come from, and why not from us ----------------------------------------
#
# The first version of this corpus was hand-written, by somebody who had spent a day inside this
# vocabulary, and it scored 100 %. That number was worthless: the phrasings that came to mind were
# the ones already known to work. An author who knows the answers cannot write the exam.
#
# So the sentences were generated instead, by a model given only what the customer *wants* -- never
# a word about intents, routers or the shapes this service matches on. Same twelve meanings, same
# eight variants each, written by something with no stake in them passing. That corpus scored 39 %,
# and every one of the 59 failures fell into FINANCIAL_QUERY, the catch-all: the router recognises
# the short imperative form and loses the sentence the moment it carries politeness or a
# subordinate clause. "¿qué cuentas tengo?" is understood; "me gustaría conocer el listado de mis
# cuentas bancarias actuales" is not.
#
# Two dead ends worth recording, because both produced numbers that meant nothing:
#
#   * The meanings were first phrased in the third person -- "preguntar cuánto gastó el usuario" --
#     and the model wrote "¿cuánto has gastado tú?", a question to the assistant about its own
#     money. Two thirds of that batch asked something else entirely, so the 29 % it scored measured
#     the prompt, not the service.
#   * A local 9B could not write the corpus at all: it leaked its reasoning into the array, emitted
#     placeholders like "cards_typed_with_typo_1", and for one whole group wrote eight sentences
#     about a different subject. Generated is not the same as usable, and every batch here was read
#     start to finish before it was kept.
#
# Generation is not reproducible -- temperature 0.8, and the model is somebody else's -- so the
# output is written down here and versioned. The measurement repeats exactly even though the
# writing of it never will. Regenerating is allowed and is a *new* corpus, with a new floor, not a
# reshuffle of this one: a corpus that gets rewritten whenever it is inconvenient measures nothing
# either.
#
# Provenance: llama-3.3-70b-versatile via Groq, 2026-08-06, prompt in the generator's docstring.
# Typos are the model's own -- two per group were asked for, as somebody typing fast on a phone.
#
# `intent` is the router's answer, not the tool that ends up replying. The two differ on purpose in
# places (a balance follow-up stays FINANCIAL_QUERY until the handler narrows it) and this file
# measures the first decision, because it is the one that cannot be recovered from: a turn that
# lands in the catch-all is handed to a planner that has no plan for it.

groups:
  - means: how much did I spend last month
    intent: FINANCIAL_QUERY
    says:
      - "Me gustaría saber cuánto he gastado el mes pasado."
      - "¿Cuánto he tirado el mes pasado?"
      - "Quiero ver cuánto dinero he gastado en el último mes."
      - "Estoy curioso por saber mi gasto total del mes anterior."
      - "¿Puedes decirme cúanto e gastado el mes pasado?"
      - "Necesito saber cuánto he gastado, ¿puedes decírmelo?"
      - "Me parece que he gastado mucho el mes pasado, ¿cuánto exactamente?"
      - "¿Cúanto he gastao el mes pasao?"

  - means: what is my balance
    intent: ACCOUNT_BALANCE
    says:
      - "¿Cuánto dinero tengo ahora mismo en mi cuenta?"
      - "Quiero saber cuánto dinero tengo en este momento."
      - "Me gustaría saber mi saldo actual, por favor."
      - "Tengo que saber cuantp dinero tengo ahorra ahora mismo."
      - "¿Cuál es mi saldo actual en el banco?"
      - "Necesito saber cuánto dinero tengo en mi cuenta bancaria en este instante."
      - "Quiero ver cuanto dinero tieno en mi cuenta, por favor."
      - "Me interesa saber cuánto dinero dispongo en mi cuenta en este momento."

  - means: which accounts do I have
    intent: ACCOUNT_BALANCE
    says:
      - "Quiero saber qué cuentas tengo abiertas en el banco."
      - "Me gustaría conocer el listado de mis cuentas bancarias actuales."
      - "¿Cuáles son las cuentas que tengo abiertas en este momento?"
      - "Tengo que revisar mis cuentas, ¿cuáles son las que están activas?"
      - "¿Puedes decirme què cuentas tengo abiertoas en el banco?"
      - "Necesito saber cuántas cuentas bancarias tengo y cuáles son."
      - "Me interesa saber quales son mis cuentas bancarias actuales, por favor."
      - "¿Podías decirme què cuentas bancarais tengo abiertas en este banco?"

