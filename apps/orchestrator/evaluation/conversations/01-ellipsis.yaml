# Elliptical replies: the sentences that mean nothing on their own.
#
# "1000", "a Marta", "el anterior", "en la hucha". Every one of them is meaningless in isolation and
# obvious in place, and the whole cost of getting one wrong is that it reaches the financial planner
# and comes back asking which period — the shape of half the failures reported from the demo.
#
# What each episode asserts is the *tool*, not the figure. A reply read by a vocabulary must not
# reach a model: which model is installed is a deployment's choice, and a conversation that only
# works on one of them is not a conversation this service can promise.

episodes:
  - name: the_amount_after_a_transfer_question
    why: >
      Reported. "¿Cuánto quieres mover a Hucha?" answered "1000 pavos" came back "¿de qué periodo?",
      because the transfer path held no state and the reply was classified from scratch.
    metrics: [context_retention, correction_recovery]
    turns:
      - say: ¿cuánto tengo?
        route: BALANCE
        no_model: true
      - say: ¿y en el fondo?
        route: BALANCE
        says: "3.150,00"
      - say: quiero traspasar del fondo a hucha
        route: TRANSFER
        awaiting: AMOUNT
      - say: 1000 pavos
        route: PAYMENT
        says: "1.000,00"
        keeps: PAYMENT_CONFIRMATION
        no_model: true
      - say: ¿y cuánto me queda en el fondo?
        route: BALANCE
      - say: gracias
        route: COURTESY

  - name: a_bare_amount_with_nothing_open
    why: >
      The other side of the same word. "1000 pavos" with no question behind it is not an amount for
      anything, and reading it as one would offer to move money nobody asked to move.
    metrics: [unsafe_action]
    turns:
      - say: hola
        route: COURTESY
      - say: 1000 pavos
        not_says: mover
        ran: {window: LAST_MONTH, categories: [], merchants: [], group_by: NONE, excluded_categories: [], excluded_merchants: []}
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: 200
        not_says: Hucha
        ran: {window: LAST_MONTH, categories: [], merchants: [], group_by: NONE, excluded_categories: [], excluded_merchants: []}
      - say: ¿y en la hucha?
        route: QUERY
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: [], accounts: ['Hucha']}
      - say: ¿cuánto tengo en la hucha?
        route: BALANCE
        says: "6.415,50"
      - say: vale gracias
        route: COURTESY

  - name: which_account_after_being_asked
    why: >
      Two piggy banks, one word for both. The question is real; the reply names one of the two it
      was just shown, and it is read by the holder's own name for the account.
    metrics: [context_retention]
    turns:
      - say: ¿cuánto dinero tengo?
        route: BALANCE
        total: 857198
      - say: quiero mover 200 € a la hucha
        route: PAYMENT
        keeps: PAYMENT_CONFIRMATION
      - say: ¿y cuánto me queda?
        route: BALANCE
      - say: pásame 50 al fondo
        route: PAYMENT
        says: Fondo indexado
      # A yes, not manners, and the corpus's own rule for COURTESY says which: a bare "perfecto" is
      # politeness only when nothing is waiting for a reply. A preview is waiting.
      - say: perfecto
        route: PAYMENT
        says: Hecho
      - say: ¿cuánto tengo en total?
        route: BALANCE

  - name: an_account_named_alone_after_a_balance
    why: >
      Reported twice in one conversation. "¿En mi Hucha?" and "Y en EL FONDO" both came back
      "¿de qué periodo?" — a question about a window, to somebody who had been told a figure and
      asked which account it was in.
    metrics: [context_retention, unnecessary_clarification]
    turns:
      - say: Oye cual es el estado actual de mi hucha de ahorros
        route: BALANCE
        no_model: true
        says: "6.415,50"
      - say: El total
        route: BALANCE
        no_model: true
      - say: En mi Hucha ?
        route: BALANCE
        says: "6.415,50"
      - say: Y en EL FONDO
        route: BALANCE
        says: "3.150,00"
      - say: y la corriente
        route: BALANCE
        says: "2.156,48"
      - say: vale
        route: COURTESY

  - name: an_account_named_alone_after_a_spending_question
    why: >
      The same sentence, the other meaning. After a question about spending, "¿y en la hucha?"
      narrows the spending — and answering the balance would be the same mistake pointing the other
      way. Each abbreviated turn states the query it must have run: reaching QUERY with the window
      of the first sentence lost is the defect, and routing alone cannot see it.
    metrics: [context_retention]
    turns:
      - say: ¿cuánto gasté el mes pasado?
        route: QUERY
        ran: {window: LAST_MONTH, direction: EXPENSE, excluded_categories: [], excluded_merchants: []}
      - say: ¿y en la hucha?
        route: QUERY
        ran: {window: LAST_MONTH, direction: EXPENSE, excluded_categories: [], excluded_merchants: [], accounts: ['Hucha']}
      - say: ¿y en gasolina?
        route: QUERY
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: [TRANSPORT_FUEL], excluded_categories: [], excluded_merchants: [], accounts: ['Hucha']}
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: ¿y en la hucha?
        route: BALANCE
        says: "6.415,50"
      - say: gracias
        route: COURTESY

  - name: the_ordinal_walk
    why: >
      "¿Y el segundo?" and "¿y el tercero?" mean nothing alone and are a position each. Reading the
      second as "one more than wherever we are" answered "el tercero" with the second.
    metrics: [context_retention]
    turns:
      - say: ¿cuál fue el gasto más caro del año en gasolina?
        route: QUERY
        ran: {rank: 1, window: THIS_YEAR, categories: [TRANSPORT_FUEL], excluded_categories: [], excluded_merchants: []}
      - say: ¿y el segundo?
        route: QUERY
        no_model: true
        ran: {rank: 2, window: THIS_YEAR, categories: [TRANSPORT_FUEL], excluded_categories: [], excluded_merchants: []}
      - say: ¿y el siguiente?
        route: QUERY
        no_model: true
        ran: {rank: 3, window: THIS_YEAR, categories: [TRANSPORT_FUEL], excluded_categories: [], excluded_merchants: []}
      - say: ¿y el quinto?
        route: QUERY
        no_model: true
        ran: {rank: 5, window: THIS_YEAR, categories: [TRANSPORT_FUEL], excluded_categories: [], excluded_merchants: []}
      - say: ¿quién eres?
        route: IDENTITY
        no_model: true
      # The turn the aside was inserted for. A question about the assistant must cost neither the
      # position nor the window nor the category, and only `ran` can say all three survived.
      - say: ¿y el sexto?
        route: QUERY
        no_model: true
        ran: {rank: 6, window: THIS_YEAR, categories: [TRANSPORT_FUEL], excluded_categories: [], excluded_merchants: []}

  - name: a_recipient_named_alone
    why: >
      "A Marta" answers a question about who, and there are two of them in this directory. The
      choice comes back as an identifier rather than the name again, which is what stops the second
      Marta from being resolved by matching a string twice.
    metrics: [unsafe_action, context_retention]
    turns:
      - say: ¿a quién puedo hacerle un bizum?
        route: CONTACTS
        no_model: true
      - say: hazle un bizum de 20 € a Marta
        route: PAYMENT
      - say: a Marta Solis Vega
        route: PAYMENT
      - say: sí
        route: PAYMENT
        says: Hecho
      - say: ¿cuánto me queda?
        route: BALANCE
      - say: gracias
        route: COURTESY

  - name: the_window_alone
    why: >
      "El mes pasado" answers a question about a period and starts nothing. Both halves are closed
      vocabularies, so the completion needs no model at all.
    metrics: [unnecessary_clarification]
    turns:
      - say: ¿cuánto gasté?
        route: QUERY
        ran: {window: LAST_MONTH, categories: [], merchants: [], group_by: NONE, excluded_categories: [], excluded_merchants: []}
      - say: el mes pasado
        route: QUERY
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: ¿y este año?
        route: QUERY
        ran: {window: THIS_YEAR, direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: en 2025
        route: QUERY
        ran: {window: '2025-01-01..2025-12-31', direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: ¿y en junio?
        route: QUERY
        ran: {window: '2026-06-01..2026-06-30', direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: ¿y el año anterior?
        route: QUERY
        no_model: true
        ran: {window: '2025-06-01..2025-06-30', direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}

  - name: a_reply_that_answers_nothing
    why: >
      "Pues no sé" fills no slot, and inventing a window for it would answer a question the user
      never finished asking. Precision over coverage, in a conversation.
    metrics: [unnecessary_clarification]
    turns:
      - say: ¿cuánto he gastado?
        route: QUERY
        ran: {window: LAST_MONTH, categories: [], merchants: [], group_by: NONE, excluded_categories: [], excluded_merchants: []}
      - say: pues no sé
        route: QUERY
        ran: {window: LAST_MONTH, categories: [], merchants: [], group_by: NONE, excluded_categories: [], excluded_merchants: []}
      - say: bueno da igual
        route: QUERY
        ran: {window: LAST_MONTH, categories: [], merchants: [], group_by: NONE, excluded_categories: [], excluded_merchants: []}
      - say: ¿cuánto tengo?
        route: BALANCE
        no_model: true
      - say: vale
        route: COURTESY
      - say: adiós
        route: COURTESY

  - name: short_replies_all_the_way_down
    why: >
      Nine turns and not one of them is a sentence. The point is that a conversation made entirely
      of fragments still has to route each one, and the balance path must not start swallowing them.
    metrics: [context_retention, wrong_tool]
    turns:
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: la hucha
        route: BALANCE
      - say: el fondo
        route: BALANCE
      - say: la corriente
        route: BALANCE
      - say: todo
        route: BALANCE
      - say: ¿quién eres?
        route: IDENTITY
      - say: la hucha
        route: BALANCE
      - say: ¿cuánto gasté?
        route: QUERY
        ran: {window: LAST_MONTH, categories: [], merchants: [], group_by: NONE, excluded_categories: [], excluded_merchants: []}
      - say: la hucha
        route: QUERY
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: [], accounts: ['Hucha']}

  - name: a_superlative_that_names_its_month
    why: >
      Every superlative-as-follow-up already in this corpus is a *bare* one — "Cual ha sido el
      gasto mas alto?", "¿y el segundo?" — and those go through the deterministic ordinal path and
      always worked. The shape that failed is the one that names its own month, because a window
      made the turn look patchable: `gasto` was missing from the self-contained vocabulary, so
      "¿cuál fue mi mayor gasto de junio?" stayed an ellipsis and the closed-vocabulary patch
      grounded the month onto the previous question instead of asking it.

      And it kept the previous aggregate's `categories` with it, which is worse than answering
      with the previous total. After "¿cuánto gasté el mes pasado en el supermercado?" this turn
      answered "465,56 € en supermercado del 2026-06-01 al 2026-06-30" — June's *supermarket*
      total, offered as the largest expense of June. A real figure, a valid plan, and an answer to
      a question nobody asked. The ordinals behind it then had no ranking to walk, so "¿y el
      segundo?" and "¿y el tercero?" both went back to the model and repeated the same total.

      `rank` is the discriminator: read as an ellipsis these turns ran an aggregate, which carries
      no rank at all. The opener and the closer are here so the widening's other half is visible
      too — a turn that stands on its own drops the inherited category, so the last turn is a
      total of everything rather than of the supermarket.
    metrics: [context_retention, wrong_tool]
    turns:
      - say: ¿cuánto gasté el mes pasado en el supermercado?
        route: QUERY
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: [GROCERIES], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}
      # The turn the episode exists for. June because the sentence says June, and no GROCERIES
      # because it is a question of its own. The category that is here is the stub planner's — it
      # answers any superlative with a fuel ranking — and this sentence names none.
      - say: ¿cuál fue mi mayor gasto de junio?
        route: QUERY
        ran: {rank: 1, window: '2026-06-01..2026-06-30', direction: EXPENSE, categories: [TRANSPORT_FUEL], excluded_categories: [], excluded_merchants: []}
      - say: ¿y el segundo?
        route: QUERY
        no_model: true
        ran: {rank: 2, window: '2026-06-01..2026-06-30', direction: EXPENSE, categories: [TRANSPORT_FUEL], excluded_categories: [], excluded_merchants: []}
      - say: ¿y el tercero?
        route: QUERY
        no_model: true
        ran: {rank: 3, window: '2026-06-01..2026-06-30', direction: EXPENSE, categories: [TRANSPORT_FUEL], excluded_categories: [], excluded_merchants: []}
      - say: gracias
        route: COURTESY
        no_model: true
      - say: ¿cuánto gasté este mes?
        route: QUERY
        ran: {window: THIS_MONTH, direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}
