# Result rows and displayed movements remain grounded across natural pronoun follow-ups.

episodes:
  - name: highlighted_groups_and_evidence_can_be_reused_without_replanning
    # scope: legacy — debt, not a choice. With the account directory wired this episode is answered
    # wrongly, and writing the wrong scope into its expectations would record the defect as
    # correct. See LEGACY_SCOPE in tests/test_conversation_corpus.py.
    #
    # Turn 7 says "de mis cuentas" outright and is answered from Cuenta corriente alone — the one
    # row turn 5's per-account breakdown happened to contain, kept as though the holder had picked
    # it. Turn 8 inherits it.
    scope: legacy
    why: >
      A pronoun must point to the concrete row or movement identifiers the user just saw, not to
      a merchant guessed by the model or to the broader query that originally produced the list.
    metrics: [wrong_tool, context_retention, unnecessary_clarification, unnecessary_model_call]
    turns:
      - say: ¿En qué categoría he gastado más este año?
        route: QUERY
        no_model: true
        ran: {window: THIS_YEAR, direction: EXPENSE, categories: [], merchants: [], group_by: CATEGORY, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: ¿Y cuánto gasté en esa categoría el mes pasado?
        route: QUERY
        no_model: true
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: ['GROCERIES'], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: Sepáralo por comercio
        route: QUERY
        no_model: true
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: ['GROCERIES'], merchants: [], group_by: COUNTERPARTY, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: ¿Cuánto gasté en ese comercio?
        route: QUERY
        no_model: true
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: ['GROCERIES'], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: [], counterparties: ['Mercadona']}
      - say: Desglósalo por cuenta
        route: QUERY
        no_model: true
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: ['GROCERIES'], merchants: [], group_by: ACCOUNT, metric: SUM, excluded_categories: [], excluded_merchants: [], counterparties: ['Mercadona']}
      - say: ¿Cuántos movimientos tuvo esa cuenta?
        route: QUERY
        no_model: true
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: ['GROCERIES'], merchants: [], group_by: NONE, metric: COUNT, excluded_categories: [], excluded_merchants: [], accounts: ['Cuenta corriente'], counterparties: ['Mercadona']}
      - say: Muéstrame los últimos 5 movimientos de mis cuentas
        route: QUERY
        no_model: true
        ran: {window: 'LAST_N_MONTHS:24', direction: ALL, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: [], include_internal: True}
      - say: ¿Cuánto suman esos movimientos?
        route: QUERY
        no_model: true
        ran: {window: 'LAST_N_MONTHS:24', direction: ALL, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: [], include_internal: True}
      - say: gracias
        route: COURTESY
