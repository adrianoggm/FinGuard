# User-taught names preserve the kind of the other side of a movement.

episodes:
  - name: typed_counterparty_aliases_survive_financial_turns
    why: >
      A person paid by Bizum must not become a merchant merely because both historically shared
      merchant_name. Teaching and reuse are grounded in banking and preserve the entity type.
    metrics: [wrong_tool, context_retention, unnecessary_clarification, unnecessary_model_call]
    turns:
      - say: Cuando diga mi hermana, me refiero a la persona Elena
        route: GUIDANCE
        no_model: true
        says: como persona
        ran: {window: 'LAST_N_MONTHS:24', direction: ALL, categories: [], merchants: [], group_by: NONE, metric: COUNT}
      - say: ¿Cuánto le envié a mi hermana este mes?
        route: QUERY
        ran: {window: THIS_MONTH, categories: [], merchants: [], group_by: NONE}
      - say: Cuando diga el súper, me refiero al comercio Mercadona
        route: GUIDANCE
        no_model: true
        says: como comercio
        ran: {window: 'LAST_N_MONTHS:24', direction: ALL, categories: [], merchants: [], group_by: NONE, metric: COUNT}
      - say: ¿Cuánto gasté en el súper este mes?
        route: QUERY
        ran: {window: THIS_MONTH, categories: ['GROCERIES'], merchants: [], group_by: NONE}
      - say: ¿Y con mi hermana?
        route: QUERY
        ran: {window: LAST_MONTH, categories: [], merchants: [], group_by: NONE}
      - say: gracias
        route: COURTESY
