# The corpus's first visual episode.
#
# Every episode before this one measured which of thirteen places answered a turn. This is the
# fourteenth: which chart a turn leaves behind, and whether the next turn's chart remembers where
# it came from.

episodes:
  - name: a_breakdown_is_reshaped_and_then_restyled
    why: >
      A financial breakdown that gets reshaped twice and then restyled, each turn remembering the
      chart the turn before it drew.

      Turn 1 asks a plain question, «¿Cuánto gasté el mes pasado?», rather than §9's own opener,
      «¿En qué he gastado más este verano?»: probed, the verano sentence reaches the planner (no
      deterministic reader claims it) because `window_words.py` excludes seasons on purpose — its
      own docstring says «en verano» is a window "a person understands and this does not, and they
      are left out on purpose". Nothing in this service can turn «este verano» into a window
      without guessing one, so handing it to the planner would cede a sentence nobody checks. This
      turn asks about last month instead — a sentence `evaluation/planning/conversations.yaml`
      already has a written expectation for — and draws a ranked breakdown bar over three spending
      categories.

      Turn 2, «Separa transporte público y gasolina.», is §9's own split, verbatim. A deterministic
      reader recognises the verb and the two named categories the moment a plan is already in view,
      so this turn never reaches the planner: one query, filtered to just those two categories,
      keeping the window turn 1 already asked about rather than restating it. Its chart derives
      from turn 1's, because turn 1 already drew a real multi-row breakdown for this to reshape.

      Turn 3, «Ahora compáralo por meses.», is §9's own regroup, verbatim: the regroup reader takes
      it against the plan turn 2 left in view, keeps that plan's direction and its two categories,
      and reads «por meses» as the calendar grouping. The answer is a month-by-month series over
      the same filtered spending — a line chart, with a temporal axis and nothing categorical left
      on either axis to sort. Its chart derives from turn 2's.

      Turn 4, «Pon el primer gráfico en vertical.», is not §9's own wording, and the episode can
      show why: turn 3's last chart is a LINE, and orientation belongs to a bar, not a time axis —
      probed directly, «en vertical»/«en horizontal» against that line chart refuses outright. So
      this turn names the chart it can turn by number, reaching back past the line to the ranked
      bar turn 1 drew, and moves its dimension from the y axis to the x axis: an effective change.

      Turn 5, «Pon el gráfico anterior en horizontal.», is §9's own restyle wording, verbatim, and
      it settles what «el gráfico anterior» means right after a restyle: it resolves to the chart
      that restyle just drew — turn 4's vertical bar — not to whichever chart stood before it and
      not to turn 3's line two turns back. Flipping it moves the dimension back to the y axis,
      landing on exactly the shape chart 1 drew, but as its own new entry: turn 5's chart derives
      from turn 4's, not from chart 1's original one. «El primer gráfico» and «el gráfico anterior»
      stay consistent with each other throughout this episode: the first always names the
      conversation's own original chart, and a restyle appends a new entry rather than mutating the
      one it derives from.

      Turns 4-5 of §9's own sketch — a drill-down into one of the split categories — are not part
      of this episode; they belong to whatever adds that route. Until then this conversation closes
      with an unrelated balance check and a courtesy, neither new, only so it still clears the
      corpus's six-turn floor.
    metrics: [context_retention]
    turns:
      - say: ¿Cuánto gasté el mes pasado?
        route: QUERY
        groups: [[RESTAURANTS, 46556, 3], [TRANSPORT, 21000, 2], [GROCERIES, 18000, 5]]
        # The breakdown floor's canonical form, probed against the real harness: chart-wide sort
        # is None, the ranking is the y axis's own sort.
        chart:
          mark: bar
          channels: [[y, dimension, nominal], [x, value_minor, quantitative], [tooltip, dimension, nominal], [tooltip, value_minor, quantitative]]
          axis_sort: [y, descending, value_minor]
        banking_calls: 1
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: Separa transporte público y gasolina.
        route: QUERY
        groups: [[TRANSPORT_PUBLIC, 32000, 4], [TRANSPORT_FUEL, 18000, 3]]
        banking_calls: 1
        no_model: true
        # §9's own split wording (Task 4). Claimed deterministically: `_SPLIT_BY_NAMES` reads the
        # verb and `category_words.precisely_named_in` reads the two names, so this never reaches
        # the planner (probed). Turn 1 already draws a real breakdown -- its own `groups:` gives it
        # three rows -- so this chart derives from it: measured `true`, not the old turn's `false`.
        # See `why`.
        derived_from: true
        chart:
          mark: bar
          channels: [[y, dimension, nominal], [x, value_minor, quantitative], [tooltip, dimension, nominal], [tooltip, value_minor, quantitative]]
          axis_sort: [y, descending, value_minor]
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: [TRANSPORT_PUBLIC, TRANSPORT_FUEL], merchants: [], group_by: CATEGORY, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: Ahora compáralo por meses.
        route: QUERY
        groups: [["2026-06", 15000, 2], ["2026-07", 17000, 3], ["2026-08", 18000, 2]]
        banking_calls: 1
        no_model: true
        derived_from: true
        # Temporal, not categorical: no axis carries its own sort, so no `axis_sort` here (Task 4).
        chart:
          mark: line
          channels: [[x, dimension, temporal], [y, value_minor, quantitative], [tooltip, dimension, temporal], [tooltip, value_minor, quantitative]]
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: [TRANSPORT_PUBLIC, TRANSPORT_FUEL], merchants: [], group_by: MONTH, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: Pon el primer gráfico en vertical.
        route: VISUAL
        banking_calls: 0
        no_model: true
        derived_from: true
        # §9's own restyle wording (Task 4). Turn 3's last chart is a LINE -- a temporal series --
        # and probed: «en vertical»/«en horizontal» against it refuses (orientation is a bar's
        # concern, not a time axis's; see `why`). Named by number instead, which reaches back past
        # the line to the breakdown bar turn 1 drew and flips it: the dimension moves from the y
        # axis to the x axis, the effective change the harness can see through `canonical()`.
        chart:
          mark: bar
          channels: [[x, dimension, nominal], [y, value_minor, quantitative], [tooltip, dimension, nominal], [tooltip, value_minor, quantitative]]
          axis_sort: [x, descending, value_minor]
      - say: Pon el gráfico anterior en horizontal.
        route: VISUAL
        banking_calls: 0
        no_model: true
        derived_from: true
        # "El gráfico anterior" settled (Task 4): right after a restyle it resolves to the chart
        # that restyle just appended -- the vertical breakdown above -- not to whichever chart stood
        # before it. Flipping it back lands on the exact shape chart 1 drew: same mark, same
        # channels, the dimension back on y. A second effective change, not a no-op. See `why`.
        chart:
          mark: bar
          channels: [[y, dimension, nominal], [x, value_minor, quantitative], [tooltip, dimension, nominal], [tooltip, value_minor, quantitative]]
          axis_sort: [y, descending, value_minor]
      - say: ¿Cuánto tengo en la cuenta corriente?
        route: BALANCE
        no_model: true
        says: 2.270,42
      - say: Gracias.
        route: COURTESY
        no_model: true
