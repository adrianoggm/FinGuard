# The corpus's first visual episode.
#
# Every episode before this one measured which of thirteen places answered a turn. This is the
# fourteenth: which chart a turn leaves behind, and whether the next turn's chart remembers where
# it came from.

episodes:
  - name: a_breakdown_is_reshaped_and_then_restyled
    why: >
      §9's base episode, the four turns 4.2 owns: turn 1 draws the first chart, 2 and 3 reshape,
      and (§9's own) turn 6 restyles it. Turns 4-5 (drill-down) are Wave 4.3's and are not here
      yet, so this episode skips straight from turn 3 to the restyle — then closes with a balance
      check and a courtesy, neither new, only so the conversation still clears the corpus's
      six-turn floor while 4.3's two turns are still missing.

      **Turns 1 and 2 are not §9's own wording.** §9's sketch — «¿En qué he gastado más este
      verano?» and «Separa transporte público y gasolina.» — reaches the planner on two sentences
      no planning case exercises, which moved `tests/test_what_we_hand_to_the_planner.py`'s two
      handover ratchets (`UNMEASURED` 22→24, `MUTE` 43→44). Those ratchets are the ratchet's own
      two ways down — "writing the case, or a deterministic reader claiming the turn back" — and
      neither is this task's to spend: the planning dataset's cases are not ours to add to and its
      `Ceiling`s are not ours to move. §9's phrasing was a sketch of *what the turns should mean*,
      not a mandate on the literal words, so this episode says the same thing in sentences the
      planning dataset already carries an expectation for. Turn 1 is
      `evaluation/planning/conversations.yaml`'s `the_category_catalogue_is_a_product_question`
      opener; turn 2 is its `shops_the_closed_vocabulary_cannot_name` breakdown request, «¿cómo se
      reparte mi sueldo este mes?» — the one sentence in that dataset whose own `why` names it a
      breakdown outright ("cómo se reparte" pide un desglose). Both reach the planner with one
      banking call each, and the `groups:` override below still supplies the multi-row answer that
      draws the same ranked-bar-by-category chart §9 sketched — the chart's shape comes from the
      fake's rows, not from the sentence, so nothing about what this episode measures moved.
      Reprobed both against the real harness after the swap; `UNMEASURED` and `MUTE` are back to
      22 and 43.

      (M5, fix wave.) Turn 2's `groups:` keys were `PUBLIC_TRANSPORT`/`FUEL`, leftovers from §9's
      pre-swap wording — under a salary question they read as the bank answering with petrol,
      which nothing here measures. Renamed to salary-shaped buckets (`SALARY`/`BONUS`), same two
      rows, same amounts and counts: the harness reads a chart's shape off the rows it is given,
      never off a category's label, so the rename changes nothing this episode asserts.

      Probed against the real harness rather than assumed from the design doc, and two things came
      back different from §9's intent regardless of wording. Turn 3, «Ahora compáralo por meses.»,
      never reaches the planner: the deterministic comparison reader recognises «compáralo» before
      any plan is built, cannot find two complete calendar periods to compare, and refuses — a real
      REFUSED turn with zero banking calls, not the QUERY the sketch assumed. And turn 2's chart
      does not derive from turn 1's: «¿Cómo se reparte mi sueldo este mes?» is a complete financial
      question on its own — a different direction, a different category, no ellipsis marker the
      deterministic turn analyser reads as a follow-up — so it is read as a new request, and its
      chart stands on its own. `derived_from` is asserted `false` there, not `true`. Both are
      measurements this task's brief asked to be reported rather than argued with, and are the
      reason `derived_from: true` is not exercised by any *reshape* turn in this episode — only by
      the restyle below, which is a different mechanism (Task 3's, not Task 4's). Whether a same-
      thread reshape should read as a follow-up is a question for whichever wave teaches the
      analyser to read one as such.

      «Pon el gráfico anterior en horizontal» is not in the interpreter's whitelist (4.1 probed
      that), so the restyle turn asks for something the vocabulary does claim instead — sorting —
      and that is the one line here that does not literally match the design doc's wording.
    metrics: [context_retention]
    turns:
      - say: ¿Cuánto gasté el mes pasado?
        route: QUERY
        groups: [[RESTAURANTS, 46556, 3], [TRANSPORT, 21000, 2], [GROCERIES, 18000, 5]]
        # The breakdown floor's canonical form, probed against the real harness: chart-wide sort
        # is None, the ranking is the y axis's own sort.
        chart:
          mark: bar
          channels: [[y, dimension, nominal], [x, value_minor, quantitative], [tooltip, dimension, nominal], [tooltip, value_minor, quantitative]]
          axis_sort: [y, descending, value_minor]
        banking_calls: 1
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: ¿Cómo se reparte mi sueldo este mes?
        route: QUERY
        groups: [[SALARY, 12000, 2], [BONUS, 9000, 1]]
        banking_calls: 1
        # Probed, not assumed: a different question about a different direction reads as a new
        # request, not a follow-up, so its chart derives from nothing. See `why`.
        derived_from: false
        ran: {window: THIS_MONTH, direction: INCOME, categories: [SALARY], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: Ahora compáralo por meses.
        route: REFUSED
        banking_calls: 0
      - say: Ordena el gráfico anterior de mayor a menor.
        route: VISUAL
        banking_calls: 0
        no_model: true
        derived_from: true
      - say: ¿Cuánto tengo en la cuenta corriente?
        route: BALANCE
        no_model: true
        says: 2.270,42
      - say: Gracias.
        route: COURTESY
        no_model: true
