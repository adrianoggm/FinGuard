# Moving money between the holder's own accounts, read out of a sentence.
#
# Nothing here stages anything. The chat reads the instruction and says where to confirm it, because
# preparing is a `payments:prepare` scope on another route — a read path that quietly gained the
# ability to stage a payment would erase the seam between asking for something and paying for it.
#
# Both halves are required for a sentence to be an instruction at all: a verb of moving *and* one of
# this holder's accounts. "Mueve el dinero" is not something anybody could act on, and "en la hucha"
# alone is a question about a balance.

episodes:
  - name: the_destination_is_the_one_after_the_preposition
    why: >
      "Traspasar el total de fondo indexado a la cuenta de ahorros" names two accounts and says
      exactly where the money goes. Counting the source as a candidate destination invented an
      ambiguity and then asked the user to resolve it.
    metrics: [unsafe_action]
    turns:
      - say: ¿cuánto tengo en el fondo?
        route: BALANCE
      - say: me gustaría traspasar el total de fondo indexado a la cuenta de ahorros
        route: TRANSFER
        awaiting: AMOUNT
        not_says: más de una cuenta
      - say: 2700 euros
        route: PAYMENT
        says: Hucha
        keeps: PAYMENT_CONFIRMATION
      - say: ¿cuánto tengo en la hucha?
        route: BALANCE
      - say: vale
        route: COURTESY
      - say: gracias
        route: COURTESY

  - name: from_one_account_to_another_both_named
    why: The source is never offered as somewhere to put the money.
    metrics: [unsafe_action]
    turns:
      - say: pasa el dinero de la hucha al fondo
        route: TRANSFER
        says: Fondo indexado
      - say: 300 €
        route: PAYMENT
        keeps: PAYMENT_CONFIRMATION
      - say: pasa 100 € del fondo a la hucha
        route: PAYMENT
        says: Hucha
        keeps: PAYMENT_CONFIRMATION
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: vale
        route: COURTESY
      - say: gracias
        route: COURTESY

  - name: a_reflexive_verb_is_a_transfer_and_not_a_payment
    why: >
      `enviar` and `mandar` are what somebody says about paying another person, and the reflexive is
      the opposite: exactly one possible destination, and it is the holder's own account. Without
      them the sentence was answered with that account's balance.
    metrics: [wrong_tool]
    turns:
      - say: me gustaría enviarme dinero a la cuenta corriente
        route: TRANSFER
        awaiting: AMOUNT
      - say: 300 euros
        route: PAYMENT
        keeps: PAYMENT_CONFIRMATION
      - say: mándame 100 € a la hucha
        route: PAYMENT
        keeps: PAYMENT_CONFIRMATION
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: vale
        route: COURTESY
      - say: gracias
        route: COURTESY

  - name: no_destination_named_at_all
    why: >
      "Transferir dinero entre cuentas" is an instruction with the destination left out. It reached
      the capability guard and was refused with a sentence about *querying* the transfers — a
      refusal about reading, to somebody asking to write.
    metrics: [wrong_tool]
    turns:
      - say: me gustaría transferir dinero entre cuentas
        route: TRANSFER
        awaiting: ACCOUNT
        says: Hucha
      - say: a la hucha
        route: TRANSFER
        awaiting: AMOUNT
      - say: 200 €
        route: PAYMENT
        keeps: PAYMENT_CONFIRMATION
      - say: ¿cuánto tengo en la hucha?
        route: BALANCE
      - say: vale
        route: COURTESY
      - say: gracias
        route: COURTESY

  - name: the_amount_and_the_account_in_either_order
    why: >
      Somebody says one or the other first, and the state has to hold whichever arrived. Both
      questions have to be answerable, which is the whole reason the transfer keeps state.
    metrics: [context_retention]
    turns:
      - say: quiero traspasar del fondo a hucha
        route: TRANSFER
        awaiting: AMOUNT
      - say: 500
        route: PAYMENT
        keeps: PAYMENT_CONFIRMATION
      # An order to move money that points nowhere this holder has. It used to reach the planner —
      # a query about last month, asked of a sentence that says to move 500 €. The amount is what
      # makes it an order; the transfer path asks for the destination it is missing.
      - say: mueve 500 € a algún sitio
        route: TRANSFER
        awaiting: ACCOUNT
        no_model: true
      - say: mueve 500 € a la hucha
        route: PAYMENT
        keeps: PAYMENT_CONFIRMATION
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: gracias
        route: COURTESY

  - name: an_account_the_holder_does_not_have
    why: >
      A custom account name is checked against the holder's real directory. If it does not exist,
      the transfer remains open and offers the actual accounts instead of guessing or refusing the
      capability.
    metrics: [wrong_tool]
    turns:
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: mueve 200 € a la cuenta de la empresa
        route: TRANSFER
        awaiting: ACCOUNT
      - say: mueve 200 € a la hucha
        route: PAYMENT
        keeps: PAYMENT_CONFIRMATION
      - say: ¿cuánto tengo en la hucha?
        route: BALANCE
      - say: vale
        route: COURTESY
      - say: gracias
        route: COURTESY

  - name: a_transfer_is_staged_and_never_moves_without_a_yes
    why: >
      This episode used to assert the opposite, and the opposite is what was wrong with it: the chat
      read the sentence in full, resolved the account and the amount, and then told the holder to go
      and say it again on a screen. A Bizum asked in the same box comes back as a preview and takes a
      yes, and there was no reason for a transfer to be the one operation that could not be finished
      where it was started.

      What has to stay true is the half that mattered: nothing moves without an explicit yes. The
      preview is the whole protection, and it is the same preview and the same confirmation route the
      form path uses.
    metrics: [unsafe_action]
    turns:
      - say: mueve 200 € a la hucha
        route: PAYMENT
        says: confirm
        keeps: PAYMENT_CONFIRMATION
      # A pleasantry is not consent. It reads as one nowhere else in the corpus and it must not here,
      # where the next word moves money — "gracias" was in the yes vocabulary and did exactly that.
      - say: gracias
        not_says: Hecho
      - say: ¿cuánto tengo en la hucha?
        route: BALANCE
        says: "5.485,50"
      # And with the preview given up, a later yes has nothing to find. This is why the intent is
      # cancelled at the bank rather than merely dropped here.
      - say: sí
        not_says: Hecho
        ran: {window: LAST_MONTH, categories: [], merchants: [], group_by: NONE, excluded_categories: [], excluded_merchants: []}
      - say: mueve 200 € a la hucha
        route: PAYMENT
        keeps: PAYMENT_CONFIRMATION
      - say: sí
        route: PAYMENT
        says: Hecho
        ends: true

  - name: three_transfers_in_a_row
    why: >
      Each one is read on its own and none of them inherits from the last. A destination that
      carried over would move money to an account named two turns ago.
    metrics: [unsafe_action, context_retention]
    turns:
      - say: mueve 100 € a la hucha
        route: PAYMENT
        says: Hucha
      - say: mueve 200 € al fondo
        route: PAYMENT
        says: Fondo indexado
      - say: mueve 300 € a la cuenta corriente
        route: PAYMENT
        says: Cuenta corriente
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: vale
        route: COURTESY
      - say: gracias
        route: COURTESY

  - name: a_transfer_asked_about_rather_than_ordered
    why: >
      The same verbs appear in questions. An interrogative turns the sentence back into a question,
      and the reply to a question would otherwise be a prompt to move money nobody asked to move.
    metrics: [unsafe_action]
    turns:
      - say: ¿cuánto paso a la hucha cada mes?
        route: QUERY
        ran: {window: LAST_MONTH, categories: [], merchants: [], group_by: NONE, excluded_categories: [], excluded_merchants: [], accounts: ['Hucha']}
      - say: ¿qué traspaso al fondo?
        route: QUERY
      # A question about the movements between the holder's own accounts, which no plan can
      # express. Refused with its reason rather than answered with every movement of the year.
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: [], accounts: ['Fondo indexado']}
      - say: ¿cuánto muevo entre cuentas?
        route: REFUSED
      - say: mueve 100 € a la hucha
        route: PAYMENT
        keeps: PAYMENT_CONFIRMATION
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: gracias
        route: COURTESY

  - name: the_whole_transfer_conversation
    why: >
      Ten turns around one instruction, with three asides and a change of mind in the middle. The
      state has to survive what belongs to it and close for everything else.
    metrics: [context_retention, unsafe_action]
    turns:
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: ¿y en el fondo?
        route: BALANCE
      - say: quiero traspasar del fondo a hucha
        route: TRANSFER
        awaiting: AMOUNT
      - say: ¿quién eres?
        route: IDENTITY
      - say: 500 €
        route: PAYMENT
        keeps: PAYMENT_CONFIRMATION
      - say: mejor 1000
        route: QUERY
        ran: {window: LAST_MONTH, categories: [], merchants: [], group_by: NONE, excluded_categories: [], excluded_merchants: []}
      - say: mueve 1000 € a la hucha
        route: PAYMENT
        keeps: PAYMENT_CONFIRMATION
      - say: ¿cuánto tengo en la hucha?
        route: BALANCE
      - say: vale
        route: COURTESY
      - say: gracias
        route: COURTESY
