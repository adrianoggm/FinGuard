episodes:
  - name: typed_relationships_inside_compound_reads
    # scope: legacy — debt, not a choice, and a *different* defect from the three that came off this
    # list. Turn 5 pairs a ratio with a plain query, and the settled account selection survives the
    # ratio half and is gone by the plain half: the sentence comes back as half a figure and half
    # «¿En qué cuenta quieres consultarlo?», and the conversation's `account_selection` is cleared
    # to None afterwards. Verified to reproduce identically with and without the fix to
    # `_remember_explicit_scope`, so nothing about a derived scope being persisted is involved —
    # a compound read simply does not carry the selection into its second operand.
    # See LEGACY_SCOPE in tests/test_conversation_corpus.py.
    scope: legacy
    why: >
      Una relación financiera cerrada sigue siendo una sola petición aunque nombre dos operandos.
      Puede convivir con otra lectura segura, conservar su memoria tras un saldo y aceptar después
      una reformulación; dividirla por su "y" interna cambiaría tanto la operación como el contexto.
    metrics: [wrong_tool, lost_context, unnecessary_model_calls, unsafe_routing]
    turns:
      - say: ¿Cuál fue mi flujo neto este mes y cuánto tengo?
        route: QUERY
        no_model: true
        ran: [{window: THIS_MONTH, direction: EXPENSE, categories: [], merchants: [], excluded_categories: [], excluded_merchants: [], group_by: NONE, metric: SUM}, {window: THIS_MONTH, direction: INCOME, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}]
      - say: ¿Y el mes pasado?
        route: QUERY
        no_model: true
        ran: [{window: LAST_MONTH, direction: EXPENSE, categories: [], merchants: [], excluded_categories: [], excluded_merchants: [], group_by: NONE, metric: SUM}, {window: LAST_MONTH, direction: INCOME, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}]
      # Earlier window first since validation fix 1 (F3): the reference the change is read from.
      - say: Compara mis gastos de junio y julio y dime cuánto tengo
        route: QUERY
        no_model: true
        ran: [{window: '2026-06-01..2026-06-30', direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}, {window: '2026-07-01..2026-07-31', direction: EXPENSE, categories: [], merchants: [], excluded_categories: [], excluded_merchants: [], group_by: NONE, metric: SUM}]
      - say: ¿Y cuál fue la diferencia porcentual?
        route: QUERY
        no_model: true
        ran: [{window: '2026-07-01..2026-07-31', direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}, {window: '2026-06-01..2026-06-30', direction: EXPENSE, categories: [], merchants: [], excluded_categories: [], excluded_merchants: [], group_by: NONE, metric: SUM}]
      - say: ¿Cuál fue mi tasa de ahorro este año y cuánto gasté en supermercado?
        route: QUERY
        ran: [{window: THIS_YEAR, categories: [], merchants: [], excluded_categories: [], excluded_merchants: [], group_by: NONE}, {window: THIS_YEAR, categories: [], merchants: [], excluded_categories: [], excluded_merchants: [], group_by: NONE}, {window: THIS_YEAR, categories: ['GROCERIES'], merchants: [], group_by: NONE, excluded_categories: [], excluded_merchants: []}]
      - say: gracias
        route: COURTESY
        no_model: true
