# Income generated in one account, followed by an account-by-account year comparison.

episodes:
  - name: the_piggy_bank_survives_the_period_clarification
    why: >
      The account name appears before the assistant asks for a period. Completing that slot must
      preserve the Hucha, and a later breakdown and polite comparison must preserve income and the
      account dimension across both calendar years.
    metrics: [wrong_tool, context_retention, unnecessary_model_call]
    turns:
      - say: ¿Cuántos ingresos me da la hucha?
        route: CLARIFY
        no_model: true
      - say: Este año
        route: QUERY
        no_model: true
        ran: {window: THIS_YEAR, direction: INCOME, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: Pero no me lo has desglosado por cuenta
        route: QUERY
        no_model: true
        ran: {window: THIS_YEAR, direction: INCOME, categories: [], merchants: [], group_by: ACCOUNT, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: Vale genial, ¿me lo podrías comparar con el año anterior?
        route: QUERY
        no_model: true
        ran: [{window: '2025-01-01..2025-12-31', direction: INCOME, categories: [], merchants: [], excluded_categories: [], excluded_merchants: [], group_by: ACCOUNT, metric: SUM}, {window: THIS_YEAR, direction: INCOME, categories: [], merchants: [], group_by: ACCOUNT, metric: SUM, excluded_categories: [], excluded_merchants: []}]
      - say: Compara este año income de cada cuenta con el año anterior
        route: QUERY
        no_model: true
        ran: [{window: '2025-01-01..2025-12-31', direction: INCOME, categories: [], merchants: [], excluded_categories: [], excluded_merchants: [], group_by: ACCOUNT, metric: SUM}, {window: THIS_YEAR, direction: INCOME, categories: [], merchants: [], group_by: ACCOUNT, metric: SUM, excluded_categories: [], excluded_merchants: []}]
      - say: Ahora, ¿cuánto gasté en la hucha este mes?
        route: QUERY
        ran: {window: THIS_MONTH, categories: [], merchants: [], group_by: NONE, excluded_categories: [], excluded_merchants: []}
      - say: gracias
        route: COURTESY
