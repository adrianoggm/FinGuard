# Calendar units remain typed while the user changes or compares the window.

episodes:
  - name: natural_calendar_periods_survive_follow_ups
    why: >
      A quarter, semester, fortnight or weekend is not a synonym for an arbitrary number of days.
      The unit must survive short follow-ups and direct comparisons without reaching the model.
    metrics: [wrong_tool, context_retention, unnecessary_clarification, unnecessary_model_call]
    turns:
      - say: ¿Cuánto he gastado este trimestre?
        route: QUERY
        no_model: true
        says: trimestre
        ran: {window: THIS_QUARTER, direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM}
      - say: Compáralo con el periodo anterior
        route: QUERY
        no_model: true
        says: trimestre pasado
        ran: {window: THIS_QUARTER, direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM}
      - say: Ahora en la segunda quincena de julio
        route: QUERY
        no_model: true
        says: "2026-07-16"
        ran: {window: '2026-07-16..2026-07-31', direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM}
      - say: ¿Y el fin de semana pasado?
        route: QUERY
        no_model: true
        says: fin de semana pasado
        ran: {window: LAST_WEEKEND, direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM}
      - say: Compara mis gastos de este semestre con el anterior
        route: QUERY
        no_model: true
        says: semestre
        ran: {window: THIS_SEMESTER, direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM}
      - say: gracias
        route: COURTESY
