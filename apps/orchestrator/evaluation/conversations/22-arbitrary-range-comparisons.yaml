# Two explicit bounded ranges become one ComparisonPlan and remain available for percentage turns.

episodes:
  - name: arbitrary_ranges_and_same_period_last_year_are_conversational
    why: >
      Exact past intervals are parsed without a model, retain the requested metric, and the typed
      pair remains available when the user asks for the percentage change or repeats the comparison.
    metrics: [wrong_tool, context_retention, unnecessary_clarification, unnecessary_model_call]
    turns:
      - say: Compara mis gastos del 1 de marzo al 15 de abril de 2026 con el mismo periodo del año pasado
        route: QUERY
        no_model: true
        says: mismo
        ran: [{window: '2025-03-01..2025-04-15', direction: EXPENSE, categories: [], merchants: [], excluded_categories: [], excluded_merchants: [], group_by: NONE, metric: SUM}, {window: '2026-03-01..2026-04-15', direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}]
      - say: ¿Y en porcentaje?
        route: QUERY
        no_model: true
        says: no cambió
        ran: [{window: '2026-03-01..2026-04-15', direction: EXPENSE, categories: [], merchants: [], excluded_categories: [], excluded_merchants: [], group_by: NONE, metric: SUM}, {window: '2025-03-01..2025-04-15', direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}]
      - say: Compara cuántos movimientos de gasto tuve del 1 de marzo al 15 de abril de 2026 con el periodo del 1 de mayo al 15 de junio de 2026
        route: QUERY
        no_model: true
        says: mismo número
        ran: [{window: '2026-05-01..2026-06-15', direction: EXPENSE, categories: [], merchants: [], excluded_categories: [], excluded_merchants: [], group_by: NONE, metric: COUNT}, {window: '2026-03-01..2026-04-15', direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: COUNT, excluded_categories: [], excluded_merchants: []}]
      - say: Compáralos otra vez
        route: QUERY
        no_model: true
        says: mismo número
        ran: [{window: '2026-05-01..2026-06-15', direction: EXPENSE, categories: [], merchants: [], excluded_categories: [], excluded_merchants: [], group_by: NONE, metric: COUNT}, {window: '2026-03-01..2026-04-15', direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: COUNT, excluded_categories: [], excluded_merchants: []}]
      - say: ¿Y en porcentaje?
        route: QUERY
        no_model: true
        says: no cambió
        ran: [{window: '2026-03-01..2026-04-15', direction: EXPENSE, categories: [], merchants: [], excluded_categories: [], excluded_merchants: [], group_by: NONE, metric: COUNT}, {window: '2026-05-01..2026-06-15', direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: COUNT, excluded_categories: [], excluded_merchants: []}]
      - say: gracias
        route: COURTESY
