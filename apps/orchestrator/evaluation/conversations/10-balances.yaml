# How much money there is, which is a state and never a sum over a window.
#
# The first question of the first reported conversation — "¿podrías decirme cuánto dinero tengo en
# mis cuentas?" — came back as "no he encontrado movimientos del 2026-08-04 al 2026-08-04". There
# were five intents and none of them was the balance, so it fell through to the financial planner,
# and a plan cannot express a balance at all. The model built the nearest thing available to it,
# which was today's movements.
#
# Three accounts and the investment is not spendable. An ASSET balance is a cost basis and never a
# valuation, so it is left out of the figure and named after it — a client that could not tell the
# kinds apart would add all three and call it what somebody has.

episodes:
  - name: the_question_that_started_everything
    why: The first turn of the first reported conversation, and the four phrasings around it.
    metrics: [wrong_tool]
    turns:
      - say: ¿podrías decirme cuánto dinero tengo en mis cuentas?
        route: BALANCE
        total: 857198
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: ¿de cuánto dispongo?
        route: BALANCE
      - say: ¿cuál es mi saldo?
        route: BALANCE
      - say: ¿cuánto dinero me queda?
        route: BALANCE
      - say: gracias
        route: COURTESY

  - name: the_investment_is_never_inside_the_figure
    why: >
      3.150,00 € is what was paid, not what it is worth, and there is no price source. Adding it in
      would report a purchase price as somebody's money.
    metrics: [wrong_tool]
    turns:
      - say: ¿cuánto dinero tengo?
        route: BALANCE
        total: 857198
        says: no lo que vale hoy
      - say: ¿y en el fondo?
        route: BALANCE
        says: "3.150,00"
      - say: ¿y en la hucha?
        route: BALANCE
        says: "6.415,50"
      - say: ¿y en la corriente?
        route: BALANCE
        says: "2.156,48"
      - say: ¿y en total?
        route: BALANCE
        total: 857198
      - say: vale
        route: COURTESY

  - name: naming_an_account_the_holder_does_not_have
    why: >
      A kind nobody holds has no figure, and inventing one would be the worst answer here. It says
      what does exist instead.
    metrics: [wrong_tool]
    turns:
      - say: ¿cuánto tengo?
        route: BALANCE
      # It asks which account instead of widening to all three, and that is the better of the two
      # answers to a question about an account nobody holds: widening returned a real figure about
      # every account under a question about one, which is nearer to inventing a figure than to
      # saying what exists. The clarification names exactly what exists, and this is what a
      # deployment does — the harness had no account directory, so no turn had ever seen it.
      - say: ¿y en la cuenta de la empresa?
        route: CLARIFY
        says: Cuenta corriente, Hucha, Fondo indexado
        keeps: ACCOUNT_SCOPE
      - say: ¿y en la hucha?
        route: QUERY
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: [], accounts: ['Hucha']}
      - say: ¿cuánto tengo en la hucha?
        route: BALANCE
      - say: vale
        route: COURTESY
      - say: gracias
        route: COURTESY

  - name: counting_things_is_not_a_balance
    why: >
      "Tengo" is about a state and also about a count, and the two overlap in every sentence that
      counts movements. Answering one with the other is a real figure about something else.
    metrics: [wrong_tool]
    turns:
      - say: ¿cuántos movimientos tengo este mes?
        route: QUERY
        ran: {window: THIS_MONTH, categories: [], merchants: [], group_by: NONE, excluded_categories: [], excluded_merchants: []}
      - say: ¿cuántas compras tengo?
        route: QUERY
        ran: {window: THIS_MONTH, direction: EXPENSE, categories: [], merchants: [], group_by: NONE, metric: COUNT, excluded_categories: [], excluded_merchants: []}
      # The episode's own subject, in the turn that failed it. A bizum is a charge, so this counts
      # movements — and it was answered by grouping twelve months of them by merchant and adding
      # them up, which is how many *people* the holder has ever sent one to.
      #
      # The window is the second half of it. Naming a category makes a follow-up decline, so the
      # fixed metric arrived with the thread dropped and this reached the planner — two turns after
      # the same question about compras kept it. Counting a kind the vocabulary knows is a filter
      # replacement like any other, so it stays here and keeps the month.
      - say: ¿cuántos bizums tengo?
        route: QUERY
        no_model: true
        ran: {window: THIS_MONTH, direction: EXPENSE, categories: ['TRANSFER_BIZUM'], merchants: [], group_by: NONE, metric: COUNT, excluded_categories: [], excluded_merchants: []}
      - say: ¿cuánto dinero tengo?
        route: BALANCE
      - say: ¿y en la hucha?
        route: BALANCE
      - say: gracias
        route: COURTESY

  - name: which_accounts_do_i_have
    why: >
      A balance answer *is* the account list: a total with every account and its figure under it. It
      used to come back "eso no puedo calcularlo todavía".
    metrics: [wrong_tool]
    turns:
      - say: ¿qué cuentas tengo?
        route: BALANCE
        no_model: true
        says: Fondo indexado
      - say: ¿cuántas cuentas tengo?
        route: BALANCE
        no_model: true
      # "Cuánto hay" is a balance question too, and the breakdown under the figure is the answer.
      - say: ¿y cuánto hay en cada una?
        route: BALANCE
      - say: ¿cuánto tengo en la hucha?
        route: BALANCE
      - say: ¿y en el fondo?
        route: BALANCE
      - say: gracias
        route: COURTESY

  - name: the_state_of_an_account_without_the_word_cuanto
    why: >
      "El estado actual de mi hucha" and "¿cómo va mi cuenta corriente?" are balance questions with
      no figure word in them. Both came back asking which period.
    metrics: [wrong_tool]
    turns:
      - say: ¿cuál es el estado actual de mi hucha?
        route: BALANCE
        says: "6.415,50"
      - say: ¿cómo va mi cuenta corriente?
        route: BALANCE
        says: "2.156,48"
      - say: ¿cómo está el fondo?
        route: BALANCE
        says: "3.150,00"
      - say: ¿y en total?
        route: BALANCE
      - say: perfecto
        route: COURTESY
      - say: gracias
        route: COURTESY

  - name: a_balance_asked_six_times_in_six_ways
    why: >
      Nobody asks the same question the same way twice, and the router has to hold all six or the
      user concludes it only works sometimes.
    metrics: [wrong_tool]
    turns:
      - say: saldo
        route: BALANCE
      - say: ¿cuánto tengo disponible?
        route: BALANCE
      - say: dinero disponible
        route: BALANCE
      - say: ¿cuánto hay?
        route: BALANCE
      - say: ¿cuánto tenía?
        route: BALANCE
      - say: gracias
        route: COURTESY

  - name: a_balance_between_two_spending_questions
    why: >
      The window of the first survives the balance, and the third turn is a follow-up of the first
      rather than of the second.
    metrics: [context_retention]
    turns:
      - say: ¿cuánto gasté el mes pasado en el supermercado?
        route: QUERY
        ran: {window: LAST_MONTH, categories: ['GROCERIES'], merchants: [], group_by: NONE, excluded_categories: [], excluded_merchants: []}
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: ¿y en gasolina?
        route: QUERY
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: ['TRANSPORT_FUEL'], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: ¿cuánto tengo en la hucha?
        route: BALANCE
      - say: ¿y en restaurantes?
        route: QUERY
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: ['RESTAURANTS'], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: gracias
        route: COURTESY

  - name: the_balance_after_moving_money
    why: >
      Read, move, read again. Nothing is staged by the chat, so the second reading is the same
      figure — and saying otherwise would be inventing a movement.
    metrics: [wrong_tool]
    turns:
      - say: ¿cuánto tengo en la hucha?
        route: BALANCE
        says: "6.415,50"
      - say: mueve 200 € a la hucha
        route: PAYMENT
      - say: ¿cuánto tengo en la hucha?
        route: BALANCE
        says: "6.415,50"
      - say: ¿y en la corriente?
        route: BALANCE
      - say: vale
        route: COURTESY
      - say: gracias
        route: COURTESY

  - name: ten_turns_of_nothing_but_balances
    why: >
      A conversation that never leaves one subject. The point is that nothing drifts: the tenth
      answer is the same as the second.
    metrics: [context_retention]
    turns:
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: ¿y en la hucha?
        route: BALANCE
        says: "6.415,50"
      - say: ¿y en el fondo?
        route: BALANCE
      - say: ¿y en la corriente?
        route: BALANCE
      - say: ¿y en total?
        route: BALANCE
      - say: ¿y en la hucha?
        route: BALANCE
        says: "6.415,50"
      - say: ¿y en los ahorros?
        route: BALANCE
        says: "6.415,50"
      - say: ¿y todo junto?
        route: BALANCE
      - say: ¿y en la hucha?
        route: BALANCE
        says: "6.415,50"
      - say: gracias
        route: COURTESY

  - name: what_there_is_in_total_said_in_passing
    why: >
      Validation fix 3, G2. «Bueno da igual. q tengo en total entre todo?» is how much money there
      is across every account. On 2026-10-08 it was read as the reply to an open question once,
      and as the net of the month's movements the next time; «bueno da igual» in front of it is
      courtesy, so the turn is no reset either.
    metrics: [wrong_tool]
    turns:
      - say: ¿Cuánto gasté en bares y restaurantes el mes pasado?
        route: QUERY
        ran: {window: LAST_MONTH, direction: EXPENSE, categories: [RESTAURANTS], merchants: [], group_by: NONE, metric: SUM, excluded_categories: [], excluded_merchants: []}
      - say: bueno da igual. q tengo en total entre todo?
        route: BALANCE
        total: 857198
      - say: ¿y en la hucha?
        route: BALANCE
        says: "6.415,50"
      - say: ¿qué tengo en total?
        route: BALANCE
        total: 857198
      - say: q tengo entre todo
        route: BALANCE
        total: 857198
      - say: gracias
        route: COURTESY
