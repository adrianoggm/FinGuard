# Stopping something halfway, which is the turn nobody writes a specification for.
#
# Cancelling is where the cost is asymmetric in the direction that matters. A cancellation that is
# not honoured leaves somebody looking at a preview they thought they had dismissed, and the next
# "sí" they type is about something else entirely.

episodes:
  - name: a_preview_refused_outright
    why: A no is a no, and the intent is cancelled rather than left waiting for a better answer.
    metrics: [unsafe_action]
    turns:
      - say: hazle un bizum de 20 € a Marta Solis Vega
        route: PAYMENT
        awaiting: CONFIRMATION
      - say: "no"
        route: PAYMENT
        ends: true
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: sí
        not_says: Hecho
      - say: ¿cuánto gasté el mes pasado?
        route: QUERY
      - say: gracias
        route: QUERY

  - name: cancelling_a_query_that_could_not_be_run
    why: >
      "Cancelar consulta" has to actually discard the saved plan, or a later "reintenta" reaches a
      question the user abandoned.
    metrics: [correction_recovery]
    turns:
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: ¿cuánto gasté el mes pasado?
        route: QUERY
      - say: cancelar consulta
        route: QUERY
      - say: reintentar
        route: QUERY
      - say: ¿cuánto gasté este año?
        route: QUERY
      - say: gracias
        route: QUERY

  - name: a_payment_dropped_before_it_was_previewed
    why: >
      Half-built and abandoned. Nothing was staged, so cancelling costs nothing — but the state has
      to close, or the next amount completes a payment nobody remembers starting.
    metrics: [unsafe_action]
    turns:
      - say: hazle un bizum a Marta Solis Vega
        route: PAYMENT
        awaiting: AMOUNT
      - say: mejor no
        not_says: Confirmas
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: 20 euros
        not_says: Confirmas
      - say: ¿cuánto gasté el mes pasado?
        route: QUERY
      - say: gracias
        route: QUERY

  - name: cancelling_and_then_doing_it_after_all
    why: >
      Changing your mind twice. The second attempt must not inherit anything from the first — a
      cancelled payment is gone, not paused.
    metrics: [unsafe_action, correction_recovery]
    turns:
      - say: hazle un bizum de 20 € a Marta Solis Vega
        route: PAYMENT
        awaiting: CONFIRMATION
      - say: "no"
        route: PAYMENT
        ends: true
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: hazle un bizum de 20 € a Marta Solis Vega
        route: PAYMENT
        awaiting: CONFIRMATION
      - say: sí
        route: PAYMENT
        says: Hecho
      - say: gracias
        route: QUERY

  - name: a_transfer_dropped_by_saying_something_else
    why: >
      A transfer has no cancellation because it has no state to cancel beyond the question it asked.
      Saying anything else ends it, which is the same thing by other means.
    metrics: [unsafe_action]
    turns:
      - say: quiero traspasar del fondo a hucha
        route: TRANSFER
        awaiting: AMOUNT
      - say: déjalo
        route: QUERY
        ends: true
      - say: 500
        not_says: Hucha
      - say: ¿cuánto tengo en el fondo?
        route: BALANCE
      - say: vale
        route: QUERY
      - say: gracias
        route: QUERY

  - name: changing_the_query_rather_than_cancelling_it
    why: >
      "Cambiar consulta" and "cancelar consulta" are two different instructions and both are
      controls this service reads itself. Neither may reach the model.
    metrics: [unnecessary_clarification]
    turns:
      - say: ¿cuánto gasté el mes pasado?
        route: QUERY
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: ¿cuánto gasté en gasolina?
        route: QUERY
      - say: cambiar consulta
        route: QUERY
      - say: ¿cuánto gasté en restaurantes?
        route: QUERY
      - say: gracias
        route: QUERY

  - name: a_no_in_the_middle_of_a_question
    why: >
      "No, en gasolina" is a correction and not a cancellation, and reading it as a refusal would
      throw away a question somebody was in the middle of asking.
    metrics: [correction_recovery]
    turns:
      - say: ¿cuánto gasté el mes pasado en el supermercado?
        route: QUERY
      - say: no, en gasolina
        route: QUERY
      - say: ¿y en restaurantes?
        route: QUERY
      - say: no es eso
        route: CLARIFY
      - say: en el supermercado
        route: QUERY
      - say: eso es
        route: QUERY

  - name: cancelling_by_changing_the_subject_entirely
    why: >
      Nobody types "cancelar". They ask about something else, and the operation has to close by
      itself rather than waiting for a word the user will never say.
    metrics: [unsafe_action]
    turns:
      - say: quiero traspasar del fondo a hucha
        route: TRANSFER
        awaiting: AMOUNT
      - say: ¿quién eres?
        route: IDENTITY
      - say: ¿cuánto gasté el mes pasado?
        route: QUERY
        ends: true
      - say: 1000
        not_says: Hucha
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: gracias
        route: QUERY

  - name: two_cancellations_in_a_row
    why: >
      Cancelling something already cancelled is not an error and must not become one. It is the turn
      a nervous user types twice.
    metrics: [unsafe_action]
    turns:
      - say: hazle un bizum de 20 € a Marta Solis Vega
        route: PAYMENT
      - say: "no"
        route: PAYMENT
        ends: true
      - say: "no"
        not_says: Hecho
      - say: déjalo
        route: QUERY
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: gracias
        route: QUERY

  - name: everything_cancelled_and_then_a_clean_conversation
    why: >
      Eight turns of stopping and starting, ending in an ordinary exchange. Nothing may have
      accumulated by then.
    metrics: [unsafe_action, context_retention]
    turns:
      - say: hazle un bizum a Marta Solis Vega
        route: PAYMENT
      - say: déjalo
        not_says: Confirmas
      - say: quiero traspasar del fondo a hucha
        route: TRANSFER
      - say: déjalo
        route: QUERY
        ends: true
      - say: ¿cuánto gasté el mes pasado?
        route: QUERY
      - say: cancelar consulta
        route: QUERY
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: ¿y en la hucha?
        route: BALANCE
        says: "5.485,50"
