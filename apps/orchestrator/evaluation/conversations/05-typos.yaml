# Typing badly, which is how everybody types.
#
# Every vocabulary in this service matches exactly. Accents are folded and case is ignored, and
# nothing else is: "cunato" is not "cuánto", "hcuha" is not "hucha", and a missing letter turns a
# balance question into a sentence for the model to guess at.
#
# **What is asserted here is deliberately asymmetric.** A typo the service reads is asserted as
# read. A typo it does not is asserted as reaching the model — because that is the honest fallback
# and a wrong guess about somebody's money is worse than a slower answer. The episodes that assert
# QUERY are not saying the behaviour is good; they are pinning where the edge is, so moving it is a
# decision somebody makes on purpose rather than a regression nobody noticed.
#
# The transposed and doubled letters here are real: they come from the reported conversations
# ("Cuanto", "tranferir", "Caunto", "movimeintos", "bixum").

episodes:
  - name: the_typos_from_the_reported_conversations
    why: >
      Every one of these was typed at the demo by somebody who was not being careful, which is the
      only way anybody types.
    metrics: [wrong_tool]
    turns:
      - say: Cuanto dinero tengo en mi cuenta de ahorros ?
        route: BALANCE
        says: "5.485,50"
      - say: Caunto he gastado este mes ?
        route: QUERY
      - say: Perdona que movimeintos he tenido ?
        route: QUERY
      - say: Me gustaria tranferir dinero a mi cuenta corriente
        route: TRANSFER
      - say: 200 euros
        route: TRANSFER
        ends: true
      - say: gracais
        route: QUERY

  - name: missing_accents_everywhere
    why: >
      Nobody types accents into a chat box. Every vocabulary folds them, and this is the episode
      that says so rather than leaving it to one lucky phrase.
    metrics: [wrong_tool]
    turns:
      - say: cuanto tengo
        route: BALANCE
      - say: y en la hucha
        route: BALANCE
      - say: cuanto gaste el mes pasado
        route: QUERY
      - say: quien eres
        route: IDENTITY
      - say: a quien puedo pagar
        route: CONTACTS
      - say: cuanto tengo en el fondo
        route: BALANCE

  - name: shouting_in_capitals
    why: >
      Case is folded too. "CUÁNTO TENGO" is the same question and it must not fall through for
      being loud.
    metrics: [wrong_tool]
    turns:
      - say: CUANTO DINERO TENGO
        route: BALANCE
      - say: Y EN LA HUCHA
        route: BALANCE
      - say: CUANTO GASTE EL MES PASADO
        route: QUERY
      - say: QUIEN ERES
        route: IDENTITY
      - say: MUEVE 200 EUROS A LA HUCHA
        route: TRANSFER
      - say: GRACIAS
        route: QUERY

  - name: a_transposed_letter_falls_through_to_the_model
    why: >
      "Cunato tengo" is not a word this service knows, and guessing at it would be guessing about a
      balance. It goes to the model, which is the honest fallback — and this pins the edge so that
      moving it is somebody's decision.
    metrics: [wrong_tool]
    turns:
      - say: cunato tengo
        route: QUERY
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: y en la hcuha
        route: QUERY
      # And the thread is gone with it: the balance memory is one turn deep, so a typo that goes to
      # the model costs the follow-up as well as itself. Asking in full works, which is the price.
      - say: ¿y en la hucha?
        route: QUERY
      - say: ¿cuánto tengo en la hucha?
        route: BALANCE
        says: "5.485,50"
      - say: gracias
        route: QUERY

  - name: extra_spaces_and_stray_punctuation
    why: >
      A chat box collects double spaces, trailing question marks and commas nobody meant. None of
      it changes what the sentence says.
    metrics: [wrong_tool]
    turns:
      - say: "¿¿cuánto  tengo??"
        route: BALANCE
      - say: "y en la hucha ,,,"
        route: BALANCE
      - say: "  ¿cuánto gasté el mes pasado?  "
        route: QUERY
      - say: "quién eres!!!"
        route: IDENTITY
      - say: "mueve 200 € a la hucha."
        route: TRANSFER
      - say: "gracias!!"
        route: QUERY

  - name: a_misspelt_recipient_is_still_ambiguous
    why: >
      Names are matched against the holder's own directory, so a half-typed one either finds
      somebody or does not. What must not happen is a payment to whoever is nearest.
    metrics: [unsafe_action]
    turns:
      - say: ¿a quién puedo pagar?
        route: CONTACTS
      - say: hazle un bizum de 20 € a Marta
        route: PAYMENT
        awaiting: RECIPIENT_CHOICE
      - say: a Marta Solis Vega
        route: PAYMENT
        awaiting: CONFIRMATION
      - say: sí
        route: PAYMENT
        says: Hecho
      - say: ¿cuánto me queda?
        route: BALANCE
      - say: gracias
        route: QUERY

  - name: typos_do_not_accumulate
    why: >
      Six sentences, three of them unreadable. The readable ones in between still have to work, and
      nothing may carry the confusion forward.
    metrics: [context_retention, wrong_tool]
    turns:
      - say: cunato tengo
        route: QUERY
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: y en la hcuha
        route: QUERY
      - say: ¿cuánto tengo en la hucha?
        route: BALANCE
      - say: qeu categorias hay
        route: QUERY
      - say: dime las categorías disponibles
        route: CATEGORIES

  - name: a_number_written_in_words
    why: >
      "Doscientos euros" is not a figure the amount grammar reads — digits and a currency word are
      what it takes — so a transfer waiting for an amount is still waiting. What it must not do is
      invent one.
    metrics: [unsafe_action]
    turns:
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: quiero traspasar del fondo a hucha
        route: TRANSFER
        awaiting: AMOUNT
      - say: doscientos euros
        not_says: "Puedes mover"
      - say: mueve 200 € a la hucha
        route: TRANSFER
        ends: true
      - say: ¿cuánto me queda en el fondo?
        route: BALANCE
      - say: gracias
        route: QUERY

  - name: writing_the_amount_three_different_ways
    why: >
      "20 euros", "20€", "20 pavos" are one figure. The grammar reads all three, and a transfer that
      only understood one of them would be a transfer that works on the demo and not in a chat.
    metrics: [wrong_tool]
    turns:
      - say: mueve 20 euros a la hucha
        route: TRANSFER
        ends: true
      - say: mueve 20€ a la hucha
        route: TRANSFER
        ends: true
      - say: mueve 20 pavos a la hucha
        route: TRANSFER
        ends: true
      - say: mueve 20,50 € a la hucha
        route: TRANSFER
        ends: true
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: gracias
        route: QUERY

  - name: a_question_mark_that_never_closes
    why: >
      Spanish opens its questions and half the world does not type the opening mark. Nothing may
      depend on it.
    metrics: [wrong_tool]
    turns:
      - say: cuanto tengo?
        route: BALANCE
      - say: y en la hucha?
        route: BALANCE
      - say: cuanto gaste el mes pasado?
        route: QUERY
      - say: quien eres?
        route: IDENTITY
      - say: a quien puedo pagar?
        route: CONTACTS
      - say: gracias
        route: QUERY
