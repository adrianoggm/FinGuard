# The audit's own sentence table (2026-09-11-wave3-audit-behaviour.md), driven for real.
#
# Every sentence below is one a holder actually typed at the demo or a natural variation of one
# already in this corpus — never a sentence invented for the harness. Two contexts, matching the
# audit's own: **bar**, a three-category breakdown («¿Cuánto gasté el último trimestre?» over
# restaurants/transporte público/supermercado); **line**, that same breakdown split into two
# transport categories and regrouped by month. Each probe turn re-establishes its context first
# (the breakdown question is deterministic and re-asking it costs nothing new to verify), so a
# turn's own state is never inherited from an unrelated probe before it — the same independence
# the audit's own table measured, kept inside one conversation rather than thirty-four.
#
# Every expectation here is honest: a right answer, an ask, or a refusal — never the wrong
# confident total the audit found pinned nowhere before this file.
#
# Task 8b (the ratchet-claiming round) closed five of the rows this file used to leave OPEN: rows
# 1-2 (B-9, size/shape words and "tarta"), row 7 ("vuelve al anterior", now an honest ask over two
# charts), row 19 ("¿por qué tanto?", now the drill's own honest ask over a NONE-grouped chart) and
# row 32 ("guarda este gráfico", answered from the chart). Row 28 ("ponme solo restaurantes") moves
# from a model-answered right guess to a deterministically claimed one. See task-8b-report.md for
# the before/after table.

episodes:
  - name: the_thirty_four_sentences_the_service_used_to_hand_over
    why: >
      B-2(a) fixed four of the audit's wrong rows outright (6, 17 — «deshaz», «en euros», both
      closed-stop-list words now the honest ask at zero calls) and B-7 gave every restyle its chips
      back (rows 3-5, 8, 11, 30 all now carry `suggestions`, where the audit found none). The rest
      were already right by Task 3's own fixes (B-1 exclusions, B-3 lineage, B-4 seasons, B-6
      why/drill, B-8 limits) or were already right in the audit itself.

      Task 8b (the ratchet-claiming round) closed five more. Rows 1-2 («hazlo más grande», «ponlo
      en tarta», B-9): the visual interpreter now reads a bare size/shape word — «más grande»,
      «más pequeño», «agrándalo», «amplía», «zoom» refuse honestly (`VISUAL_INCOMPATIBLE`, "el
      tamaño lo decide la pantalla…"), and «tarta»/«pastel»/«quesito» join «circular»/«donut»/
      «anillo» as a real donut restyle. Row 7 («vuelve al anterior»): three words past
      `_a_bare_shop_name`'s own two-word ceiling, so B-2(a)'s stop-list never reached it — the
      interpreter itself now asks (`VISUAL_AMBIGUOUS`, two chips) when the phrase names no style
      word of its own, over two or more charts; with only one chart in view (as at the audit's own
      row) there is nothing to go back to, so the probe here first draws a second chart to test the
      real ambiguity. Row 19 («¿por qué tanto?»): the harness artefact stands (turn 1's own plan is
      `group_by: NONE`), and it is exactly what the fix targets — a NONE-grouped chart has no bar
      to drill, so the drill reader now asks which breakdown is meant («¿Tanto en qué? Puedo
      desglosarlo por categoría o por mes.») instead of falling through to the model. Row 32
      («guarda este gráfico», B-7's own save request): answered from the chart already on screen,
      zero ledger calls, `VISUAL_UNCHANGED` with the save affordance in its text (or an honest
      refusal when metrics are off). Row 28 («ponme solo restaurantes») was already the right
      category by luck of the stub, but model-answered and so unmeasured in production; the
      analyser's reshape reader now claims the same imperative phrasing `_CATEGORY_FILTER_FOLLOW_UP`
      already reads for «solo restaurantes», so it narrows deterministically instead.
