      never touched: probed again here, they still answer a total for a sentence that named no
      figure. «Vuelve al anterior» (row 7) is three words, one past `_a_bare_shop_name`'s own
      two-word ceiling, so B-2(a)'s stop-list never reaches it — still a confident, unrelated total.
      «Guarda este gráfico» (row 32, B-7's own save request) is still answered with a total too;
      chips were this task's B-7, not a save handler. «¿Por qué tanto?» (row 19) still reaches the
