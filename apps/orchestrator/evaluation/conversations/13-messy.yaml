      A transfer, a payment and a query, opened in that order and closed in another. One workflow at
      a time is the invariant, and this is what it looks like from outside.
    metrics: [unsafe_action, context_retention]
    turns:
      - say: ¿cuánto tengo?
        route: BALANCE
      - say: quiero traspasar del fondo a hucha
        route: TRANSFER
        awaiting: AMOUNT
      - say: hazle un bizum a Marta Solis Vega
        route: PAYMENT
        awaiting: AMOUNT
      - say: 500
        route: PAYMENT
        awaiting: CONFIRMATION
      - say: "no"
        route: PAYMENT
        ends: true
      - say: ¿cuánto gasté el mes pasado?
        route: QUERY
        ran: {window: LAST_MONTH, categories: [], merchants: [], group_by: NONE, excluded_categories: [], excluded_merchants: []}
      - say: mueve 500 € a la hucha
        route: PAYMENT
        keeps: PAYMENT_CONFIRMATION
      - say: ¿cuánto tengo en la hucha?
        route: BALANCE
      - say: gracias
        route: COURTESY

