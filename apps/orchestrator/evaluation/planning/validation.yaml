# Held-out set. The prompt has never been tuned against these.
#
# Same groups, same reference date, same rules as dev.yaml — different sentences. This
# is the only number worth quoting to somebody else: a prompt tuned against 120 cases
# scores well on those 120 by construction, and the gap between the two files is how
# much of the dev score was fitting rather than understanding.
#
# The discipline is the point and it is easy to lose. **Do not read the failures here
# while tuning the prompt.** Run it, write the number down, go back to dev.yaml. The
# moment a case from this file informs a prompt change, it stops being held out and its
# score stops meaning anything.
#
# Written after dev.yaml deliberately: the schema had settled by then, so these did not
# have to be rewritten when the plan format moved.

reference: 2026-07-15
account: ES-0001

