# Drift set: the same question, said the way somebody else says it -> the same plan.
#
# dev.yaml says it in its own header -- "THE PROMPT IS TUNED AGAINST THIS FILE, so its scores
# are an upper bound" -- and validation.yaml is untuned but a model was selected on it. Both
# were written by people who knew what this planner understands. That is the bias this file
# exists outside of: nobody who wrote these sentences had seen the prompt, the vocabulary or
# the schema.
#
# The dispatch layer got the same treatment first, in tests/test_the_same_question_said_
# differently.py, and the result is the reason this exists. A hand-written robustness corpus
# scored 100 % there and a generated one scored 39 %, on the same twelve meanings. The gap was
# not the service getting worse between two Tuesdays; it was the author knowing the answers.
#
# Ten canonical questions and eight paraphrases of each, from a model told only what the
# customer wants -- never a word about periods, categories, directions or what this planner can
# express. Two of the ten must be REFUSED rather than planned: a guard that only refuses the
# phrasings it was built against is the exact failure this service is arranged around, which is
# a real figure answering a different question.
#
# **Every `plan` here is copied from dev.yaml, never invented.** The paraphrases are new; the
# opinion about what the right answer is stays where it already was, so a disagreement between
# the two files is a bug in one of them rather than a difference of taste.
#
# `paraphrase_of` chains each group to its own first case, so `_check_paraphrases` reports the
# splits: "this phrasing right, that one wrong" is the finding, and the rate is the summary.
#
# Five of the eighty generated sentences were dropped, under a rule fixed before anything was
# run and applied before the planner had answered anything: the time expression has to survive.
# Two lost it entirely ("en gasolina para el coche hasta ahora"), two swapped LAST_WEEK for a
# seven-day window, one blurred thirty days into "el último mes más o menos". Recorded here
# rather than quietly filtered -- a corpus that loses its inconvenient cases is the bias again,
# wearing a different hat.
#
# Provenance: llama-3.3-70b-versatile via Groq, 2026-08-06, prompt in the generator's docstring.
# Typos are the model's own. Regenerating produces a NEW corpus with a new baseline, not a
# reshuffle of this one.
#
# The reference date is dev.yaml's, and for dev.yaml's reason: on the 1st of a month, or a
# Monday, THIS_MONTH and LAST_MONTH and LAST_N_DAYS collapse into each other and every case
# here stops discriminating. The generator was told never to write an absolute date.

