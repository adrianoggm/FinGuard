# FinGuard GENERALIZATION set: conversations that measure two conversation engines on wording
# and on combinations of mechanisms they were not built from.
#
# Generated on 2026-10-09 by an agent that never saw either engine's code. It read only
# evaluation/engine/regression/conversations.yaml, evaluation/engine/regression/ux.yaml, the
# skill .claude/skills/finguard-real-conversation/SKILL.md (rubric and mechanism tags) and
# evaluation/real/README.md.
#
# FROZEN. No engine is ever tuned on what is written here, and no expectation is ever edited to
# make a turn pass: a failure is fixed in the engine, never in this file.
#
# Same schema as the regression set: `conversations:` of {name, goal, turns: [{say, expect:
# {mechanism, route?, want}}]}. `mechanism` is one of the skill's tags; `route` is given when the
# kind of answer is not in doubt; `want` (Spanish) is what a good assistant does, for the judge,
# never what any engine does today. The holder is Laura; today is 2026-10-08 (a Thursday), there
# are movements up to yesterday and the history starts in February 2025.
#
# (a) `<name>-v` and `ux-<name>-v`: one paraphrased variant of each of the 23 regression
#     conversations and each of the 10 ux episodes: same goal, same number of turns, same intent
#     per turn, different words. The ux `route` + `ran` are translated into `want`.
# (b) `combo-<topic>`: new conversations of 5-9 turns, each composing three or more mechanisms in
#     orders the regression set does not use.
#
# No turn says «sí», «vale», «ok» or «confirmo» after a payment, transfer or bizum preview: a goal
# that ends in a payment is met at a correct preview and a «no».
conversations:
  # =============================================================================================
  # (a) Variants of the regression conversations
  # =============================================================================================
  - name: gimnasio-ultimamente-v
    goal: Saber cuánto se ha gastado en el gimnasio últimamente, en todas sus cuentas.
    turns:
      - say: "oye y ultimamente cuanto me he dejado en el gimnasio?"
        expect:
          mechanism: unnecessary_clarification
          route: QUERY
          want: >-
            Gimnasio en los últimos 30 días («últimamente»), en todas las cuentas, diciendo la
            ventana; sin preguntar ni el periodo ni la cuenta.
      - say: "en todas las cuentas porfa"
        expect:
          mechanism: pending_resolution
          route: QUERY
          want: >-
            Gimnasio, la misma ventana, todas las cuentas. Si quedaba una pregunta abierta, la
            respuesta la completa y solo se pregunta lo que falte, nombrando el gimnasio. Nunca el
            saldo.
      - say: "amplialo a 3 meses"
        expect:
          mechanism: follow_up
          route: QUERY
          want: >-
            Gimnasio en los últimos tres meses, en todas las cuentas.

  - name: gimnasio-meses-v
    goal: Saber lo gastado en el gimnasio estos meses y luego qué clases tiene su gimnasio.
    turns:
      - say: "hola, cuanto me he gastado en el gimnacio estos ultimos meses?"
        expect:
          mechanism: intent
          want: >-
            Gimnasio pese a «gimnacio». «Estos últimos meses» no dice cuántos: vale preguntarlo
            nombrando el gimnasio, o asumir una ventana y decirla. Nunca pregunta la cuenta.
      - say: "todas las cuentas"
        expect:
          mechanism: pending_resolution
          want: >-
            Conserva el gimnasio y la ventana (o la pregunta de cuántos meses) y lo extiende a
            todas las cuentas. Nunca el saldo.
      - say: "gimnasio he dicho!!"
        expect:
          mechanism: follow_up
          route: QUERY
          want: >-
            Gimnasio (corrige el tema si se había leído otra cosa), con la misma ventana y
            cuentas, y la cifra.
      - say: "sacamelo por categorias"
        expect:
          mechanism: follow_up
          route: QUERY
          want: >-
            El gasto de la misma ventana por categoría; la ventana y las cuentas no se pierden.
      - say: "y en ocio cuanto?"
        expect:
          mechanism: slot_carryover
          route: QUERY
          want: >-
            Ocio, con la misma ventana y cuentas.
      - say: "oye y cual es mi gimnasio? el que me cobra"
        expect:
          mechanism: intent
          route: QUERY
          want: >-
            El gimnasio que aparece en sus movimientos (el comercio, p. ej. Altafit), sacado de
            los datos y sin inventar.
      - say: "y q clases dan en el altafit?"
        expect:
          mechanism: intent
          route: ACTIVITIES
          want: >-
            Las clases de Altafit por el agente de actividades, o una negativa clara si no está
            disponible. Nunca una cifra de gasto.
      - say: "y de boxeo?"
        expect:
          mechanism: follow_up
          route: ACTIVITIES
          want: >-
            Las clases de boxeo de Altafit (filtra la oferta anterior); no lo lee como comercio
            ni como categoría.

  - name: spotify-llevo-v
    goal: Saber cuánto lleva gastado en Spotify, en todas sus cuentas.
    turns:
      - say: "q llevo pagao de spotify?"
        expect:
          mechanism: unnecessary_clarification
          route: QUERY
          want: >-
            Spotify en lo que va de año («llevo pagao»), en todas las cuentas, diciendo la
            ventana; sin preguntar ni el periodo ni la cuenta.
      - say: "en lo que va de 2026"
        expect:
          mechanism: pending_resolution
          route: QUERY
          want: >-
            Spotify este año (2026). Si quedaba abierta la pregunta de la cuenta, conserva el año
            y pregunta solo la cuenta: no repite la misma pregunta perdiendo el periodo.
      - say: "de todas las cuentas"
        expect:
          mechanism: pending_resolution
          route: QUERY
          want: >-
            Spotify este año en todas las cuentas. Nunca el saldo.

  - name: transfer-then-compare-v
    goal: Empezar un traspaso a la hucha, cambiar de idea y comparar la gasolina de dos meses.
    turns:
      - say: "quiero mover algo de pasta a la hucha"
        expect:
          mechanism: execution
          route: PAYMENT
          want: >-
            Traspaso a la hucha que pregunta cuánto; no mueve dinero.
      - say: "espera, en gasolina gaste mas en julio o en junio?"
        expect:
          mechanism: interruption
          route: QUERY
          want: >-
            Deja el traspaso y compara la gasolina de junio con la de julio (las dos cifras y la
            diferencia); no lo lee como importe ni como concepto del traspaso.
      - say: "en todas las cuentas"
        expect:
          mechanism: pending_resolution
          route: QUERY
          want: >-
            La comparación de gasolina en todas las cuentas. Nunca el saldo ni el traspaso.

  - name: marta-ella-pago-v
    goal: Ver lo que se han mandado con Marta este mes y luego mandarle 20 €, y echarse atrás.
    turns:
      - say: "este mes cuanto le he enviado a marta?"
        expect:
          mechanism: intent
          route: QUERY
          want: >-
            Lo enviado a Marta este mes.
      - say: "y ella a mi cuanto?"
        expect:
          mechanism: follow_up
          route: QUERY
          want: >-
            Lo recibido de Marta este mes: la misma persona y ventana con la dirección invertida;
            sin preguntar el periodo.
      - say: "bueno, quiero pasarle 20€ a marta solis vega"
        expect:
          mechanism: interruption
          route: PAYMENT
          want: >-
            Vista previa de un pago de 20,00 € a Marta Solís Vega que pide confirmación; no
            ejecuta nada.
      - say: "no, mejor no"
        expect:
          mechanism: execution
          route: PAYMENT
          want: >-
            Cancela el pago y lo dice; no se mueve dinero.

  - name: comparacion-gasolina-v
    goal: Comparar junio y julio, primero en restaurantes y luego en gasolina.
    turns:
      - say: "comparame junio y julio en restaurantes"
        expect:
          mechanism: intent
          route: QUERY
          want: >-
            Restaurantes en junio frente a julio, con las dos cifras y la diferencia.
      - say: "y la gasolina?"
        expect:
          mechanism: comparison
          route: QUERY
          want: >-
            Gasolina en junio frente a julio (mantiene los dos meses, cambia la categoría).
      - say: "pasamelo a %"
        expect:
          mechanism: comparison
          route: QUERY
          want: >-
            La misma comparación de gasolina expresada en porcentaje.
      - say: "y de julio solo?"
        expect:
          mechanism: follow_up
          route: QUERY
          want: >-
            Gasolina en julio, una sola cifra.

  - name: olvidalo-v
    goal: Preguntar por el súper, corregirse, abandonar y acabar preguntando el saldo.
    turns:
      - say: "q me gaste el mes pasado en el supermercao"
        expect:
          mechanism: intent
          route: QUERY
          want: >-
            Supermercado el mes pasado pese a «supermercao», en todas las cuentas.
      - say: "no no, eso no era"
        expect:
          mechanism: reset
          want: >-
            Un acuse breve que deja lo anterior (o pregunta qué quería decir); sin cifra y sin
            buscar un comercio.
      - say: "la gasolina"
        expect:
          mechanism: intent
          want: >-
            Gasolina: o el mes pasado (corrigiendo el tema) o la pregunta del periodo nombrando la
            gasolina. Nunca el súper ni «gasolina» como comercio desconocido.
      - say: "nada, dejalo estar"
        expect:
          mechanism: reset
          want: >-
            Deja lo pendiente y lo dice en una frase; no busca un comercio llamado «dejalo
            estar».
      - say: "cuanta pasta tengo?"
        expect:
          mechanism: intent
          route: BALANCE
          want: >-
            El saldo de todas las cuentas («pasta» es dinero), sin ventana heredada.

  - name: suscripciones-v
    goal: Ver lo gastado en suscripciones y acotarlo a un servicio y a otro mes sin perder el resto.
    turns:
      - say: "en los ultimos nueve meses cuanto he pagado de suscripciones?"
        expect:
          mechanism: intent
          route: QUERY
          want: >-
            Suscripciones en los últimos 9 meses, en todas las cuentas, sin preguntar la cuenta.
      - say: "solo lo de netflix"
        expect:
          mechanism: follow_up
          route: QUERY
          want: >-
            Netflix en los mismos 9 meses.
      - say: "y en lo que va de mes?"
        expect:
          mechanism: slot_carryover
          route: QUERY
          want: >-
            Netflix este mes.
      - say: "perdona, spotify queria decir"
        expect:
          mechanism: follow_up
          route: QUERY
          want: >-
            Spotify este mes (corrige el servicio y conserva el mes).
      - say: "y el mes de antes?"
        expect:
          mechanism: slot_carryover
          route: QUERY
          want: >-
            Spotify el mes pasado (septiembre de 2026).
      - say: "genial, gracias!"
        expect:
          mechanism: intent
          route: COURTESY
          want: >-
            Una respuesta de cortesía breve, sin cifra ni pregunta.

  - name: gimnasio-marta-v
    goal: >-
      Saber cuánto cuesta el gimnasio y después pagar 20 € a Marta; parar en una vista previa
      correcta y decir «no».
    turns:
      - say: "el gimnasio cuanto me sale al mes?"
        expect:
          mechanism: unnecessary_clarification
          route: QUERY
          want: >-
            Lo que cuesta el gimnasio al mes (el cargo mensual, p. ej. Altafit), en todas las
            cuentas, diciendo la ventana; sin preguntar la cuenta.
      - say: "en todas las cuentas"
        expect:
          mechanism: pending_resolution
          route: QUERY
          want: >-
            El gimnasio en todas las cuentas: completa la pregunta de la cuenta si quedaba abierta,
            o mantiene la misma consulta si ya era en todas. Nunca el saldo.
      - say: "envia 20 euros a marta"
        expect:
          mechanism: intent
          route: PAYMENT
          want: >-
            Un pago de 20,00 € a Marta: hay dos contactos con ese nombre, así que pregunta cuál
            nombrando los dos (Marta Ruiz Gómez y Marta Solís Vega). No ejecuta nada.
      - say: "a marta ruiz"
        expect:
          mechanism: pending_resolution
          route: PAYMENT
          want: >-
            Elige a Marta Ruiz Gómez y muestra la vista previa de 20,00 € que pide confirmación;
            no ejecuta nada.
      - say: "no, cancela"
        expect:
          mechanism: execution
          route: PAYMENT
          want: >-
            Cancela el pago y lo dice; no se mueve dinero.

  - name: comparar-meses-v
    goal: Comparar dos meses y después cambiar la categoría de la comparación.
    turns:
      - say: "restaurantes, agosto vs septiembre, cuanto gaste?"
        expect:
          mechanism: unnecessary_clarification
          route: QUERY
          want: >-
            Restaurantes en agosto frente a septiembre de 2026, con las dos cifras y la
            diferencia, en todas las cuentas y diciéndolo; sin preguntar la cuenta.
      - say: "todas las cuentas"
        expect:
          mechanism: pending_resolution
          route: QUERY
          want: >-
            La misma comparación de restaurantes en todas las cuentas: completa la pregunta de la
            cuenta si quedaba abierta, o la deja igual. Nunca el saldo ni pierde un mes.
      - say: "y del supermercado?"
        expect:
          mechanism: comparison
          route: QUERY
          want: >-
            Supermercado en agosto frente a septiembre de 2026 (mantiene los dos meses y cambia la
            categoría), con las dos cifras y la diferencia; sin preguntar el periodo.
      - say: "agosto y septiembre igual que antes"
        expect:
          mechanism: pending_resolution
          route: QUERY
          want: >-
            Supermercado en agosto frente a septiembre de 2026: completa una pregunta abierta o
            repite la misma comparación. No pregunta el año, que ya era 2026.
      - say: "del 2026"
        expect:
          mechanism: pending_resolution
          route: QUERY
          want: >-
            Supermercado en agosto frente a septiembre de 2026: «del 2026» completa una pregunta
            del año si quedaba, y si no, deja la misma comparación. Nunca «Sigo sin tener claro el
            periodo».
      - say: "super septiembre 2026 contra agosto 2026"
        expect:
          mechanism: intent
          route: QUERY
          want: >-
            Supermercado en septiembre frente a agosto de 2026, con las dos cifras y la
            diferencia, en todas las cuentas.
      - say: "y en ocio q?"
        expect:
          mechanism: comparison
          route: QUERY
          want: >-
            Ocio en los mismos dos meses, agosto y septiembre de 2026 (mantiene los dos meses y
            cambia la categoría) pese a la «q» final; sin preguntar el periodo.
      - say: "agosto y septiembre, los de 2026"
        expect:
          mechanism: pending_resolution
          route: QUERY
          want: >-
            Ocio en agosto frente a septiembre de 2026: completa la pregunta del periodo si
            quedaba, o repite la misma comparación. Nunca vuelve al supermercado ni a un solo mes.

  - name: mandado-recibido-v
    goal: >-
      Saber cuánto le he enviado a alguien este mes, después cuánto me ha enviado esa persona a
      mí, y luego algo totalmente distinto.
    turns:
      - say: "cuanto le he enbiado a marta ruiz este mes?"
        expect:
          mechanism: unnecessary_clarification
          route: QUERY
          want: >-
            Lo enviado a Marta Ruiz este mes pese a «enbiado», en todas las cuentas; sin
            preguntar la cuenta. Si no hay nada, lo dice.
      - say: "en todas las cuentas"
        expect:
          mechanism: pending_resolution
          route: QUERY
          want: >-
            Lo enviado a Marta Ruiz este mes en todas las cuentas: completa la pregunta de la
            cuenta si quedaba abierta, o mantiene la misma consulta. Nunca el saldo.
      - say: "mejor los ultimos 3 meses"
        expect:
          mechanism: follow_up
          route: QUERY
          want: >-
            Lo enviado a Marta Ruiz en los últimos tres meses, en todas las cuentas.
      - say: "y ella cuanto me ha pasado?"
        expect:
          mechanism: follow_up
          route: QUERY
          want: >-
            Lo recibido de Marta Ruiz en los últimos tres meses: la misma persona y ventana con la
            dirección invertida; sin preguntar el periodo.
      - say: "en esos 3 meses"
        expect:
          mechanism: pending_resolution
          route: QUERY
          want: >-
            Lo recibido de Marta Ruiz en los últimos 3 meses: completa la pregunta del periodo si
            quedaba, o confirma la misma ventana. Nunca vuelve a lo enviado.
      - say: "que no, lo que he recibido de ella"
        expect:
          mechanism: follow_up
          route: QUERY
          want: >-
            Lo recibido de Marta Ruiz (la dirección invertida) en la misma ventana de 3 meses; sin
            preguntar el periodo.
      - say: "bah, da igual. que saldo tiene la hucha?"
        expect:
          mechanism: interruption
          route: BALANCE
          want: >-
            Deja lo que estuviera pendiente y da el saldo de la Hucha.
      - say: "y la cuenta corriente?"
        expect:
          mechanism: slot_carryover
          route: BALANCE
          want: >-
            El saldo de la Cuenta corriente (sigue siendo una pregunta de saldo); no reabre la
            consulta de Marta.

  - name: suscripciones-olvidalo-v
    goal: Preguntar por las suscripciones, corregirse y después abandonar («olvídalo»).
    turns:
      - say: "q pago de suscripciones"
        expect:
          mechanism: unnecessary_clarification
          route: QUERY
          want: >-
            Suscripciones en lo que va de mes (o la ventana que asuma, diciéndola), en todas las
            cuentas; sin preguntar la cuenta.
      - say: "de todas mis cuentas"
        expect:
          mechanism: pending_resolution
          route: QUERY
          want: >-
            Suscripciones en la misma ventana en todas las cuentas: completa la pregunta de la
            cuenta si quedaba abierta, o mantiene la misma consulta. Nunca el saldo.
      - say: "perdon, me referia al mes pasado"
        expect:
          mechanism: follow_up
          route: QUERY
          want: >-
            Suscripciones el mes pasado, en todas las cuentas (corrige la ventana y conserva el
            tema).
      - say: "buf, nada, olvida"
        expect:
          mechanism: reset
          want: >-
            Un acuse breve que deja lo anterior; no repite la consulta ni da una cifra.
      - say: "q no, que lo dejes"
        expect:
          mechanism: reset
          want: >-
            Deja lo anterior en una frase; no lo lee como una petición de cálculo ni repite la
            cifra.
      - say: "olvidalo ya"
        expect:
          mechanism: reset
          want: >-
            Deja lo pendiente y lo dice en una frase; ni repite la consulta ni da una cifra.

  - name: super-restaurantes-gasolina-v
    goal: Comparar dos meses y después cambiar la categoría de la comparación.
    turns:
      - say: "en el súper cuando gaste mas, en agosto o en julio?"
        expect:
          mechanism: intent
          route: QUERY
          want: >-
            Supermercado en julio frente a agosto de 2026, con las dos cifras y la diferencia, en
            todas las cuentas.
      - say: "y los restaurantes"
        expect:
          mechanism: comparison
          route: QUERY
          want: >-
            Restaurantes en julio frente a agosto de 2026 (mantiene los dos meses y cambia la
            categoría).
      - say: "no perdona, gasolina"
        expect:
          mechanism: comparison
          route: QUERY
          want: >-
            Gasolina en julio frente a agosto de 2026: corrige la categoría y conserva la
            comparación. Nunca un solo mes.
      - say: "de julio y agosto eh"
        expect:
          mechanism: unnecessary_clarification
          route: QUERY
          want: >-
            Gasolina en julio frente a agosto de 2026, el año de la comparación; no pregunta el
            año.
      - say: "de este año"
        expect:
          mechanism: pending_resolution
          route: QUERY
          want: >-
            Si quedaba abierta la pregunta del año, «de este año» la completa: gasolina en julio
            frente a agosto de 2026. Nunca todo el gasto del año.
      - say: "gasolina agosto vs julio"
        expect:
          mechanism: intent
          route: QUERY
          want: >-
            Gasolina en agosto frente a julio de 2026, con las dos cifras y la diferencia.
      - say: "y lo de salud?"
        expect:
          mechanism: comparison
          route: QUERY
          want: >-
            Salud en julio frente a agosto de 2026 (mantiene los dos meses y cambia la categoría);
            no pasa a este mes.
      - say: "los mismos meses de antes, julio y agosto"
        expect:
          mechanism: reference
          route: QUERY
          want: >-
            Salud en julio frente a agosto de 2026, los meses de antes; no pregunta el año.

  - name: carmen-mandado-recibido-v
    goal: >-
      Saber cuánto le he enviado a alguien este mes, después cuánto me ha enviado esa persona a mí,
      y luego algo totalmente distinto.
    turns:
      - say: "este mes cuanto le he pasado a carmen"
        expect:
          mechanism: intent
          route: QUERY
          want: >-
            Lo enviado a Carmen este mes, en todas las cuentas y sin preguntar la cuenta. Si no hay
            nada, lo dice.
      - say: "amplia a tres meses"
        expect:
          mechanism: follow_up
          route: QUERY
          want: >-
            Lo enviado a Carmen en los últimos tres meses.
      - say: "y ella q me ha mandado a mi?"
        expect:
          mechanism: reference
          route: QUERY
          want: >-
            Lo recibido de Carmen («ella») en los mismos tres meses: la misma persona y ventana con
            la dirección invertida; sin preguntar el periodo.
      - say: "en esos tres meses igual"
        expect:
          mechanism: pending_resolution
          route: QUERY
          want: >-
            Lo recibido de Carmen en los últimos tres meses: completa la pregunta del periodo si
            quedaba abierta, o repite la misma consulta. Nunca «Sigo sin tener claro el periodo».
      - say: "3 ultimos meses"
        expect:
          mechanism: pending_resolution
          route: QUERY
          want: >-
            Lo recibido de Carmen en los últimos 3 meses. Nunca todo el gasto de esos meses.
      - say: "no, lo q carmen me ha enviado a mi"
        expect:
          mechanism: follow_up
          route: QUERY
          want: >-
            Lo recibido de Carmen en los mismos tres meses; sin preguntar el periodo.
      - say: "bueno da igual. q suscripciones me cobran?"
        expect:
          mechanism: interruption
          route: QUERY
          want: >-
            Deja lo pendiente y dice qué suscripciones se le cobran (los comercios), diciendo la
            ventana.

  - name: suscripciones-dejalo-v
    goal: Preguntar por las suscripciones, corregirse y después abandonar («olvídalo»).
    turns:
      - say: "cuánto me gasto en suscripciones"
        expect:
          mechanism: unnecessary_clarification
          route: QUERY
          want: >-
            Suscripciones en lo que va de mes (o la ventana que asuma, diciéndola), en todas las
            cuentas; sin preguntar la cuenta.
      - say: "uy, el mes pasado queria decir"
        expect:
          mechanism: follow_up
          route: QUERY
          want: >-
            Suscripciones el mes pasado (corrige la ventana y conserva el tema).
      - say: "da igual, déjalo"
        expect:
          mechanism: reset
          want: >-
            Un acuse breve que deja lo anterior; no lo lee como una petición de cálculo ni da una
