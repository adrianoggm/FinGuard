# Model catalogue for local development.
#
# Adding a model or changing the fallback does not need a release: point
# ORCHESTRATOR_LLM_CATALOGUE_FILE at this file and restart the service.
#
#   fallback = "FAIL"   the error reaches the caller. Use it when measuring: a silent
#                       substitution would skew the numbers.
#   fallback = "NEXT"   the rest of the catalogue is tried in order, and the answer
#                       reports which models were attempted first.

fallback = "NEXT"
default = "echo-1"
temperature = 0.2
max_output_tokens = 1024

# The unit is the model, not the provider: two models of the same provider are two
# entries. Order matters — it is the order the fallback walks.
[[models]]
alias = "echo-1"
provider = "echo"
model = "echo-1"

[[models]]
alias = "echo-2"
provider = "echo"
model = "echo-2"

# Local inference. Nothing leaves the machine: no API key, no egress, and a demo that
# works with the network unplugged.
#
# This catalogue chooses who *answers*. It does not choose who *plans* — turning a
# sentence into a query is a different job with its own measurement, and that model is
# ORCHESTRATOR_PLANNER_MODEL, picked with scripts/evaluate_planning.py. One knob per
# decision.
#
# [[models]]
# alias = "local"
# provider = "ollama"
# model = "qwen2.5-coder:7b"

# Hosted inference, for comparing against something bigger than an 8 GB card fits.
#
# The provider is `xai` and not `grok`: Grok is the family of models it serves, and this
# file's own rule is that the unit is the model. Two Grok models are two entries.
#
# It only exists when ORCHESTRATOR_XAI_API_KEY is set — see .env.defaults for where the key
# goes, which is not there and not here. With no key these entries name a provider this
# build does not have, and the catalogue refuses to load rather than failing at the first
# question.
#
# Everything typed here leaves the machine. That is the difference from `ollama` above and
# it is a decision about somebody's bank questions, not a performance setting.
#
# Model names come from the vendor and change; `curl -H "Authorization: Bearer $KEY"
# https://api.x.ai/v1/models` lists what your key can reach today.
#
# [[models]]
# alias = "grok"
# provider = "xai"
# model = "grok-4-fast"
