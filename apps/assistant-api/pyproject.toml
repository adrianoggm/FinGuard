[project]
name = "finguard-assistant-api"
version = "0.1.0"
description = "Orquestador conversacional de FinGuard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # httpx2 es el sucesor de httpx (github.com/pydantic/httpx2) y es lo que pide
    # starlette>=1.3 en su testclient. Con "httpx" se cae al camino deprecado.
    "httpx2>=2.9",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finguard_assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: necesita PostgreSQL en marcha"]
