    group: follow_up
    question: ¿Y desglosado por categorías?
    previous: {period: {period: LAST_MONTH}, direction: EXPENSE}
    expect: plan
    plan: {period: {period: LAST_MONTH}, direction: EXPENSE, groupBy: CATEGORY}

  - id: follow_period_change_keeps_category
    group: follow_up
    question: ¿Y este mes?
    previous: {period: {period: LAST_MONTH}, direction: EXPENSE, categories: [TRANSPORT_FUEL]}
    expect: plan
    # The window changes; the category stays.
    plan:
      period: {period: THIS_MONTH}
      direction: EXPENSE
      categories: [TRANSPORT_FUEL]

  - id: follow_direction_change
    group: follow_up
    question: ¿Y lo que me entró?
    previous: {period: {period: LAST_MONTH}, direction: EXPENSE}
    expect: plan
    plan: {period: {period: LAST_MONTH}, direction: INCOME}

  - id: follow_fresh_question_drops_context
    group: follow_up
    question: ¿Cuánto gasté hoy?
    previous: {period: {period: LAST_MONTH}, direction: EXPENSE, groupBy: CATEGORY}
    expect: plan
    # A complete question. Inheriting CATEGORY would add a breakdown nobody asked for,
    # which is the failure mode of context that carries too much.
    plan: {period: {period: TODAY}, direction: EXPENSE, groupBy: NONE}

  - id: follow_without_context_must_ask
    group: follow_up
    question: ¿Y en gasolina?
    expect: clarification
    why: with no previous plan the sentence names no window at all

  - id: follow_metric_change
    group: follow_up
    question: ¿Y cuántas veces?
    previous: {period: {period: LAST_MONTH}, direction: EXPENSE, categories: [GROCERIES]}
    expect: plan
    plan:
      period: {period: LAST_MONTH}
      direction: EXPENSE
      categories: [GROCERIES]
      metric: COUNT

  - id: follow_narrow_to_week
    group: follow_up
    question: ¿Y solo la semana pasada?
    previous: {period: {period: LAST_MONTH}, direction: EXPENSE, categories: [RESTAURANTS]}
    expect: plan
    plan:
      period: {period: LAST_WEEK}
      direction: EXPENSE
      categories: [RESTAURANTS]

  - id: follow_by_merchant
    group: follow_up
    question: ¿Y por comercios?
    previous: {period: {period: THIS_MONTH}, direction: EXPENSE}
    expect: plan
    plan: {period: {period: THIS_MONTH}, direction: EXPENSE, groupBy: MERCHANT}

  - id: follow_ambiguous_stays_ambiguous
    group: follow_up
    question: ¿Y lo normal?
    previous: {period: {period: LAST_MONTH}, direction: EXPENSE}
    expect: clarification
    why: context supplies a window, not a meaning for "normal"

  # --- ambiguity --------------------------------------------------------------------

  - id: ambiguous_ultimamente
    group: ambiguity
    question: ¿Cuánto he gastado últimamente?
    expect: clarification
    why: "'últimamente' names no window; every Period would be a guess"

  - id: ambiguous_lo_normal
    group: ambiguity
    question: ¿Estoy gastando lo normal?
    expect: clarification
    why: no baseline is defined; "normal" is not a period, a category or a figure

  - id: ambiguous_gastos_grandes
    group: ambiguity
    question: Enséñame mis gastos grandes
    expect: clarification
    why: no threshold given, and the schema has no amount filter

  - id: ambiguous_desde_navidad
    group: ambiguity
    question: ¿Cuánto llevo gastado desde Navidad?
    expect: clarification
    why: which Christmas, and does the range end today — two guesses stacked

  - id: ambiguous_bare_cuanto
    group: ambiguity
    question: ¿Cuánto?
    expect: clarification
    why: no period, no direction, no subject

  - id: ambiguous_mucho
    group: ambiguity
    question: ¿He gastado mucho?
    expect: clarification
    why: "'mucho' is a judgement, and against no stated window"

  - id: ambiguous_como_voy
    group: ambiguity
    question: ¿Cómo voy de dinero?
    expect: clarification
    why: could be a balance, a total or a comparison; none is named

  - id: ambiguous_ese_mes
    group: ambiguity
    question: ¿Cuánto gasté ese mes?
    expect: clarification
    why: "'ese' points at a month no previous turn established"

  # --- unsupported ------------------------------------------------------------------

  - id: unsupported_monthly_average
    group: unsupported
    question: ¿Cuál es mi gasto medio mensual?
    expect: unsupported
    why: Metric has SUM and COUNT, no average. A SUM grouped by month is not the answer

  - id: unsupported_comparison
    group: unsupported
    question: ¿He gastado más este mes que el anterior?
    expect: unsupported
    why: a comparison is two plans; FinancialQuery expresses one

  - id: unsupported_forecast
    group: unsupported
    question: ¿Cuánto voy a gastar el mes que viene?
    expect: unsupported
    why: prediction, and the ledger only holds what already happened

  - id: unsupported_advice
    group: unsupported
    question: ¿En qué debería recortar gastos?
    expect: unsupported
    why: advice, not a query over what happened

  - id: unsupported_percentage
    group: unsupported
    question: ¿Qué porcentaje de mi sueldo se va en alquiler?
    expect: unsupported
    why: a ratio between two figures; the schema returns one

  - id: unsupported_projection
    group: unsupported
    question: A este ritmo, ¿llegaré a fin de mes?
    expect: unsupported
    why: projection plus a judgement, neither of which is a window over the ledger

  # --- noise ------------------------------------------------------------------------
  # Surface changes that must not change the plan. A model whose answer depends on
  # punctuation is matching strings, not reading.

  - id: noise_greeting
    group: noise
    question: Hola, buenas. Oye, ¿cuánto gasté el mes pasado?
    expect: plan
    paraphrase_of: direction_gaste
    plan: {period: {period: LAST_MONTH}, direction: EXPENSE}

  - id: noise_thanks
    group: noise
    question: ¿Cuánto gasté el mes pasado? Gracias!!
    expect: plan
    paraphrase_of: direction_gaste
    plan: {period: {period: LAST_MONTH}, direction: EXPENSE}

  - id: noise_no_accents
    group: noise
    question: cuanto gaste el mes pasado
    expect: plan
    paraphrase_of: direction_gaste
    plan: {period: {period: LAST_MONTH}, direction: EXPENSE}

  - id: noise_uppercase
    group: noise
    question: ¿CUÁNTO GASTÉ EL MES PASADO?
    expect: plan
    paraphrase_of: direction_gaste
    plan: {period: {period: LAST_MONTH}, direction: EXPENSE}

  - id: noise_typos
    group: noise
    question: cuanto gsate en gasolina este mess?
    expect: plan
    plan: {period: {period: THIS_MONTH}, direction: EXPENSE, categories: [TRANSPORT_FUEL]}

  - id: noise_rambling
    group: noise
    question: pues nada, que estaba mirando las cuentas y quería saber cuánto gasté en el súper el mes pasado
    expect: plan
    plan:
      period: {period: LAST_MONTH}
      direction: EXPENSE
      categories: [GROCERIES]
