    group: grouping
    question: ¿Cómo se reparte mi gasto de los últimos 30 días?
    expect: plan
    plan:
      period: {period: LAST_N_DAYS, n: 30}
      direction: EXPENSE
      groupBy: CATEGORY

  # --- merchant ---------------------------------------------------------------------
  # There is no merchant filter in FinancialQuery, only groupBy MERCHANT. Answering with
  # the category silently widens the question to every other shop inside it.

  - id: merchant_mercadona
    group: merchant
    question: ¿Cuánto me he gastado en Mercadona este mes?
    expect: clarification
    why: no merchant filter exists; GROCERIES also covers Carrefour, Lidl and Dia

  - id: merchant_netflix
    group: merchant
    question: ¿Cuánto pago al mes por Netflix?
    expect: clarification
    why: a SUBSCRIPTIONS total also includes Spotify and the gym

  - id: merchant_repsol
    group: merchant
    question: ¿Cuánto he gastado en Repsol este mes?
    expect: clarification
    why: TRANSPORT_FUEL would also count Cepsa, BP and Shell

  - id: merchant_gym
    group: merchant
    question: ¿Cuánto me cuesta el gimnasio?
    expect: clarification
    why: the gym is one merchant inside SUBSCRIPTIONS, which also holds Netflix

  - id: merchant_top_ranking
    group: merchant
    question: ¿Cuál es el comercio donde más gasto este mes?
    expect: plan
    # This one IS expressible: group by merchant and read the top row.
    plan: {period: {period: THIS_MONTH}, direction: EXPENSE, groupBy: MERCHANT}

  - id: merchant_top_ranking_last_month
    group: merchant
    question: ¿En qué comercio gasté más el mes pasado?
    expect: plan
    paraphrase_of: merchant_top_ranking
    plan: {period: {period: LAST_MONTH}, direction: EXPENSE, groupBy: MERCHANT}

