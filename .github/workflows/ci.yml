name: ci

# One run per merge into main, and nothing else without asking.
#
# This used to run on every push to every branch plus every PR into main or develop: up to ten
# jobs a push, four of them on Windows runners, which bill at twice a Linux minute. A feature
# branch with a day's worth of commits could spend a meaningful slice of a month's included
# minutes on a question already answered by `just check` locally.
#
# So the gate moved to where a mistake actually becomes expensive — the merge into main — and
# `workflow_dispatch` covers verifying a branch before that.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:

# Keyed on the pull request, not the ref: `github.ref` on a pull_request event is the merge ref,
# so a manual run and a PR run on the same branch would otherwise cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job below repeats one condition:
#
#     if: github.event_name == 'workflow_dispatch' || github.head_ref == 'develop'
#
# `branches:` above filters the *target*, so a PR from anywhere into main matches it; this filters
# the source. It is written out three times because there is nowhere to put it once — a workflow
# level `if` does not exist, `env` is not readable from a job level `if`, and a shared gate job
# would spend a runner to say no. An anchor would deduplicate the text and not the maintenance.
#
# Worth knowing before these become required checks: GitHub counts a skipped job as satisfied. A
# hotfix branch opened straight against main would go green having run nothing, so if they are
# made required, restrict what may target main at the branch protection level as well.
jobs:
  # Fast and database-free: PEP 8, types and unit tests, across the Python versions
  # and the operating systems the team develops on. Development happens on Windows
  # and the images run on Linux, so both have to be green.
  check:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'develop'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
        # voice-gateway joined here after phase 6. Its speech providers are optional extras, so a
        # plain `uv sync` is as light as the other two and the deterministic fake-provider suite is
        # what runs; the one test that needs a real provider skips itself. Adding it found that the
        # service had never been through its own formatter and that a test's 10 ms deadline lost a
        # thread handoff on Windows every time.
        service: [banking-api, orchestrator, voice-gateway]
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/${{ matrix.service }}/uv.lock

      # --frozen fails if the lock has drifted from the pyproject, instead of
      # re-resolving and verifying something different from what runs locally.
      # --python overrides the repository's .python-version so the matrix means
      # something.
      - run: uv sync --frozen --python ${{ matrix.python }}

      # E and W are pycodestyle, N is pep8-naming: the PEP 8 check the review asked
      # for. format --check keeps the layout from drifting.
      - run: uv run ruff check .
      - run: uv run ruff format --check .

      - run: uv run mypy src
      - run: uv run pytest -q -m "not integration"

  # The client, which until now was verified by opening it and looking. It holds the whole
  # conversation — the service keeps none — so a mistake there deletes context and the model
  # then answers a question nobody asked. That is worth a build breaking over.
  #
  # No Python, no database and no service: the client talks to an orchestrator that is not
  # running here. What this can check is that it compiles, that its types agree with the
  # payloads it claims to receive, and that the state machine holding the conversation still
  # follows its four rules.
  web:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'develop'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # `ci` rather than `install`: it fails if the lock has drifted from the manifest, the
      # same property `uv sync --frozen` gives the Python jobs.
      - run: npm ci

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # What can only be checked against a real PostgreSQL: the ledger invariants, the
  # query compiler, and that the dataset loads and adds up.
  #
  # Linux only: GitHub service containers do not run on Windows runners. The Windows
  # coverage of the integration path is therefore a gap — running it there means
  # installing PostgreSQL on the runner, which is a decision of its own.
  integration:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'develop'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: finguard
          POSTGRES_PASSWORD: finguard
          POSTGRES_DB: finguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: finguard
      BANKING_DATABASE_URL: postgresql://finguard_banking:finguard_banking@127.0.0.1:5432/finguard_banking
      BANKING_QUERY_DATABASE_URL: postgresql://finguard_query_reader:finguard_query_reader@127.0.0.1:5432/finguard_banking
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/banking-api/uv.lock

      - name: Install psql if the runner does not ship it
        run: command -v psql || sudo apt-get install -y --no-install-recommends postgresql-client

      # The same files Docker Compose uses locally: one database and one role per
      # service, with no cross access.
      - name: Create the databases and per-service roles
        run: |
          for script in infrastructure/postgres/init/*.sql; do
            echo "== $script"
            psql -h 127.0.0.1 -U finguard -d finguard -v ON_ERROR_STOP=1 -f "$script"
          done

      - run: uv sync --frozen
        working-directory: apps/banking-api

      - run: uv run alembic upgrade head
        working-directory: apps/banking-api

      - run: uv run pytest -q
        working-directory: apps/banking-api

      - name: Load the dataset and check that it adds up
        run: |
          psql "$BANKING_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f apps/banking-api/seeds/0001_demo.sql
          psql "$BANKING_DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/banking-api/seeds/verify.sql

      # Two kinds of case (vision.md §17): deterministic ones fail if a figure stops
      # matching what expected.sql computed, heuristic ones fail if the judge's score
      # drops below the case threshold.
      - name: Query engine accuracy, deterministic and heuristic
        run: uv run python scripts/evaluate_queries.py
        working-directory: apps/banking-api

      # The dataset is a versioned artefact: regenerating it cannot change it.
      - name: The dataset generator is still deterministic
        run: |
          uv run python scripts/generate_seed.py
          git diff --exit-code -- seeds/
        working-directory: apps/banking-api
