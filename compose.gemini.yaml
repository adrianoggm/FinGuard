# The demo on Gemini, layered over compose.yaml:
#   docker compose -f compose.yaml -f compose.gemini.yaml --profile core up -d --wait --build
#
# The key is not here: put ORCHESTRATOR_GEMINI_API_KEY in the ignored apps/orchestrator/.env,
# which compose.yaml already reads. A separate file for the same reason as compose.voice-real.yaml:
# the knobs a hosted model needs belong together, and a recipe cannot set them in PowerShell.
services:
  orchestrator:
    environment:
      ORCHESTRATOR_PLANNER_PROVIDER: gemini
      ORCHESTRATOR_PLANNER_MODEL: ${FINGUARD_GEMINI_MODEL:-gemini-3.5-flash}
      ORCHESTRATOR_ENGINE_MODEL: ${FINGUARD_GEMINI_MODEL:-gemini-3.5-flash}
      ORCHESTRATOR_PLANNER_TEMPERATURE: "0"
      ORCHESTRATOR_ENGINE_TEMPERATURE: "0"
      ORCHESTRATOR_VISUAL_PLANNER: hybrid
      # Measured, not guessed (2026-10-12, gemini-3.5-flash). The visual planner's call is the
      # turn's second, and its request's P95 was 12.9 s over 121 turns. At the 6 s default every
      # chart timed out into the rules' floor (fallback_reason=timeout), so no chart was ever the
      # model's; at 30 s, five of five were. Kept at 30 with pacing off as headroom for a slow
      # request, never past ORCHESTRATOR_GEMINI_TIMEOUT_SECONDS.
      ORCHESTRATOR_VISUAL_PLANNER_BUDGET_SECONDS: "30"
      # Pacing off by default here: the demo's key is on a paid tier, not the free tier's 5
      # requests a minute the code's 12 s default protects, and with it half of a chart turn was
      # waiting for the interval. A free-tier key sets GEMINI_MIN_REQUEST_INTERVAL_SECONDS=12 in
      # the shell or the project's .env before `just demo`.
      ORCHESTRATOR_GEMINI_MIN_REQUEST_INTERVAL_SECONDS: ${GEMINI_MIN_REQUEST_INTERVAL_SECONDS:-0}
