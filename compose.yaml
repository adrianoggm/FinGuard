name: finguard

# Profiles:
#   core  skeleton: database + backend APIs
#   poc   everything that exists: core + skin (web, and later a mobile app)
#   voice  core + the real-time voice gateway (phase 6)
#   observability  the trace and metric stack, on its own and additive to any of the above
#   a2a  the A2A gateway and three simulated gyms, additive to core: `just a2a`
#
# A single component needs no profile: docker compose up postgres
# Everything is published on 127.0.0.1 only: the credentials are for development
# (rule 13).

services:
  postgres:
    image: postgres:18-alpine
    profiles: ["core", "poc", "voice"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finguard}
      POSTGRES_DB: ${POSTGRES_DB:-finguard}
    # Development credentials are trivial, so localhost only: publishing on 0.0.0.0
    # would expose the database to the whole local network.
    # 5442 on the host: 5432 and 5433 are usually taken by other projects.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      # On Postgres 18+ the volume mounts at /var/lib/postgresql, not at .../data.
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finguard} -d ${POSTGRES_DB:-finguard}"]
      interval: 5s
      timeout: 3s
      retries: 10

  banking-api:
    build:
      context: .
      dockerfile: apps/banking-api/Dockerfile
    profiles: ["core", "poc", "voice"]
    environment:
      BANKING_DATABASE_URL: postgresql://finguard_banking:finguard_banking@postgres:5432/finguard_banking
      # Read-only role for the query engine (§8.6)
      BANKING_QUERY_DATABASE_URL: postgresql://finguard_query_reader:finguard_query_reader@postgres:5432/finguard_banking
    ports:
      - "127.0.0.1:${BANKING_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  orchestrator-db-init:
    image: postgres:18-alpine
    profiles: ["core", "poc", "voice"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-finguard}
    command: ["/bin/sh", "/scripts/reconcile-orchestrator.sh"]
    volumes:
      - ./infrastructure/postgres/reconcile-orchestrator.sh:/scripts/reconcile-orchestrator.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator-migrate:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    profiles: ["core", "poc", "voice"]
    environment:
      DATABASE_URL: postgresql://finguard_orchestrator:finguard_orchestrator@postgres:5432/finguard_orchestrator
    command: ["alembic", "upgrade", "head"]
    depends_on:
      orchestrator-db-init:
        condition: service_completed_successfully

  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
      args:
        # Passed by `just up`, "unknown" when somebody runs compose directly. /version reports it,
        # so "which build am I talking to" is one request rather than an inference.
        BUILD_SHA: ${FINGUARD_SHA:-unknown}
        BUILD_REF: ${FINGUARD_REF:-unknown}
    profiles: ["core", "poc", "voice"]
    # The same file the host reads, so a credential lives in exactly one place whichever way
    # the service is started. The Dockerfile deliberately does not COPY it — a secret baked
    # into an image is a secret in every registry that image reaches — so without this,
    # `uv run` saw the key and `just up` did not.
    #
    # Optional, because the file is gitignored and a fresh clone has none. `required: true`
    # is compose's default and would refuse to start the demo for a provider nobody is using.
    #
    # Read *before* `environment:` below, which is the order that matters: the service names
    # on this network are not something a developer's .env should be able to override.
    env_file:
      - path: ./apps/orchestrator/.env
        required: false
    environment:
      # Which models exist, which provider serves each one and what happens when one
      # fails come from this file, not from code. Mounted read-only so it can change
      # without rebuilding the image.
      ORCHESTRATOR_LLM_CATALOGUE_FILE: /app/config/llm.toml
      # The ledger, by service name on the compose network.
      ORCHESTRATOR_BANKING_BASE_URL: http://banking-api:8001
      ORCHESTRATOR_DATABASE_URL: postgresql://finguard_orchestrator:finguard_orchestrator@postgres:5432/finguard_orchestrator
      ORCHESTRATOR_METRICS_ENABLED: "true"
      ORCHESTRATOR_METRICS_SIGNING_KEYS: '["default:ZmluZ3VhcmQtbWV0cmljLWtleS0zMi1ieXRlcy1sb25n"]'
      # The local model runs on the host, not in a container: that is where the GPU is,
      # and 127.0.0.1 inside a container is the container. Nothing leaves the machine.
      ORCHESTRATOR_OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Operational numbers, each a measurement rather than a preference — see
      # apps/orchestrator/evaluation/planning/RESULTS.md. Stated here rather than left
      # to the defaults so the knobs are visible to whoever runs this.
      ORCHESTRATOR_OLLAMA_CONTEXT_TOKENS: "4096"
      ORCHESTRATOR_OLLAMA_SEED: "0"
      ORCHESTRATOR_OLLAMA_KEEP_ALIVE: 30m
      ORCHESTRATOR_OLLAMA_TIMEOUT_SECONDS: "120"
      ORCHESTRATOR_BANKING_TIMEOUT_SECONDS: "10"
      ORCHESTRATOR_SUPPORTING_MOVEMENTS: "10"
      # Who draws a chart: `deterministic` until the Task 9 runbook's three `evaluate-visual`
      # runs (docs/superpowers/plans/2026-09-05-visual-planner-shadow.md) say otherwise. This
      # key exists so that runbook's flip step has something real to flip -- `bootstrap/main.py`
      # reads `settings.visual_planner` from this exact variable when wiring the app.
      ORCHESTRATOR_VISUAL_PLANNER: deterministic
      # The deterministic router remains authoritative wherever it recognises a turn. A model only
      # widens its generic catch-all, and cannot create a payment or an own-account transfer.
      ORCHESTRATOR_TURN_INTERPRETER: hybrid
      # Identity, first layer of the security stack (§12.1). A development token table,
      # not the design: §12.2 asks for OAuth with short-lived tokens. What matters is
      # that the account now comes from the credential, so a caller cannot name one.
      #
      # Only defensible because nothing is published beyond 127.0.0.1 (rule 13). A
      # deployment injects these from a secret store and never from a compose file.
      # The financial endpoints are off by default while two measured risks stay open
      # (see docs/next.md). Compose turns them on because this is the demo stack.
      ORCHESTRATOR_QUESTIONS_ENABLED: "true"
      # Payments too, separately, because they are a separate risk: this is the surface where a
      # sentence somebody typed ends in a bank transfer. It is behind a preview, an explicit
      # confirmation read by an allow-list, and two scopes.
      ORCHESTRATOR_PAYMENTS_ENABLED: "true"
      # The web client's origins. Loopback only (rule 13), and exact rather than `*` because the
      # credential travels in a header.
      ORCHESTRATOR_WEB_ORIGINS: '["http://127.0.0.1:3000","http://localhost:3000","http://127.0.0.1:5173","http://localhost:5173"]'
      # token:holder:account[:timezone]. The zone is the holder's, not the deployment's:
      # between midnight and 01:00 peninsular time "hoy" in the Canaries is the previous
      # day, and it travels to banking beside the reference date so both services bin the
      # same purchase on the same day.
      # Two holders, because one cannot express containment. The seed always had three;
      # the token table had one entry, so "a caller cannot read another account" was a
      # claim with no way to test it. Diego is in a different zone on purpose.
      #
      # A fourth entry holds the payment scopes, and Laura's ordinary token does not: the demo
      # can move money only with a credential issued for it. `payments:prepare` and
      # `payments:confirm` travel together there because the account holder is one person doing
      # two turns — the split exists so a credential *can* be issued with only the first, for an
      # integration that drafts payments somebody else approves.
      #
      # The web demo token also asks and books expert agents (spec §14 A4): `agents:ask` searches,
      # `agents:book` confirms, split for the same reason as the two payment scopes. They do
      # nothing until ORCHESTRATOR_A2A_GATEWAY_URL below names a gateway.
      ORCHESTRATOR_DEV_TOKENS: '["demo-token-laura-0001:ES-0001:08aba04f-2b30-4639-88a6-eac741153ce0:Europe/Madrid:questions:read,metrics:read,metrics:write","demo-token-diego-0002:ES-0002:eb8161d7-0b39-459f-a553-9eb9d9c1e187:Atlantic/Canary:questions:read,metrics:read,metrics:write","demo-token-operator:ES-0001:08aba04f-2b30-4639-88a6-eac741153ce0:Europe/Madrid:questions:read,assistant:use,assistant:admin,metrics:read,metrics:write","demo-token-laura-pays:ES-0001:08aba04f-2b30-4639-88a6-eac741153ce0:Europe/Madrid:questions:read,movements:categorise,payments:prepare,payments:confirm,metrics:read,metrics:write,agents:ask,agents:book"]'
      # A2A expert agents (spec §3.5). Blank by default, and blank means the capability does not
      # exist: the orchestrator is in `core` and the gateway only in `a2a`, so a stack started
      # without that profile must not point at a service that is not there. `just a2a` sets it.
      ORCHESTRATOR_A2A_GATEWAY_URL: ${ORCHESTRATOR_A2A_GATEWAY_URL:-}
      # The gateway's development token, stated on both sides (a2a-gateway below).
      ORCHESTRATOR_A2A_GATEWAY_TOKEN: dev-a2a-gateway-token
    extra_hosts:
      # Linux does not resolve host.docker.internal on its own; Docker Desktop does.
      # Stating it keeps the compose file working on both.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/orchestrator/config:/app/config:ro
    ports:
      - "127.0.0.1:${ORCHESTRATOR_PORT:-8000}:8000"
    depends_on:
      orchestrator-migrate:
        condition: service_completed_successfully
      banking-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ADR-010: a channel adapter, not a second financial assistant. It may reach the orchestrator
  # and nothing else — no banking, no database, no financial types — so it has no credential of
  # its own: the caller's token travels through it to the orchestrator.
  voice-gateway:
    build:
      context: apps/voice-gateway
      dockerfile: Dockerfile
      args:
        # The image is CPU-oriented. Faster Whisper is an optional extra, off by default because
        # it pulls CTranslate2 and downloads a model on first use; the fake provider is what makes
        # the compose stack start in seconds.
        INSTALL_LOCAL_STT: ${VOICE_INSTALL_LOCAL_STT:-0}
        INSTALL_LOCAL_TTS: ${VOICE_INSTALL_LOCAL_TTS:-0}
    profiles: ["voice"]
    environment:
      # The assistant by service name on this network, not the loopback default, which inside a
      # container is the container.
      VOICE_GATEWAY_ASSISTANT_MODE: orchestrator_http
      VOICE_GATEWAY_ORCHESTRATOR_BASE_URL: http://orchestrator:8000
      # Fake speech by default. Local providers are measured on the host where the GPU and the
      # models are — see apps/voice-gateway/evaluation/RESULTS.md — and switching them on here
      # means building with the extra and mounting a voice.
      # The page that may call this, exactly, and never a wildcard: the caller's token is in a
      # header. Same origins the orchestrator lists, because it is the same client.
      VOICE_GATEWAY_WEB_ORIGINS: '["http://127.0.0.1:3000","http://localhost:3000","http://127.0.0.1:5173","http://localhost:5173"]'
      VOICE_GATEWAY_STT_MODE: ${VOICE_STT_MODE:-fake}
      VOICE_GATEWAY_TTS_MODE: ${VOICE_TTS_MODE:-fake}
      # The voice lives in the model volume, not in the image: `just voice-models` downloads it.
      VOICE_GATEWAY_TTS_MODEL_PATH: /models/piper/es_ES-davefx-medium.onnx
      VOICE_GATEWAY_TTS_WARMUP: "true"
      # Unconditionally true because the gateway only warms up in local mode: a missing model or a
      # broken runtime then fails the healthcheck instead of the holder's first sentence.
      VOICE_GATEWAY_STT_WARMUP: "true"
      # Named models are downloaded on first use. Without a cache that is half a gigabyte every
      # time the container is recreated, which turns `just voice` into a download.
      HF_HOME: /models/huggingface
    volumes:
      - voice-models:/models
    # 8002 on the host, beside banking's 8001. Not 8080: it is the most contested port on a
    # development machine — Docker Desktop's own Kubernetes forwarding had it on this one — and
    # the container's port stays 8000 either way.
    ports:
      - "127.0.0.1:${VOICE_GATEWAY_PORT:-8002}:8000"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # --- a2a ---------------------------------------------------------------------------
  #
  # FinGuard consumes expert agents over A2A 1.0 and publishes none
  # (docs/superpowers/specs/2026-09-30-a2a-expert-agents-design.md). The gateway is the one
  # FinGuard process that speaks the protocol; it holds the agents' credentials and nothing else
  # — no banking, no database, no model. The three gyms stand in for third parties the way the
  # synthetic ledger stands in for a bank: one codebase (apps/simulated-gym-agent), deployed three
  # times with GYM_STYLE, and FinGuard knows each only by its URL.
  #
  # Each gym is reached two ways, which is why it has two URLs. GYM_A2A_URL is written into its
  # card's interfaces and is the name the gateway calls on this network; GYM_PUBLIC_URL is the
  # card's provider and the origin of norte's linking page, so a browser on the host can open the
  # link a reply carries (spec §14 A3). Development credentials only, published on 127.0.0.1
  # (rule 13), like every other value in this file.

  gym-norte:
    build:
      context: apps/simulated-gym-agent
    profiles: ["a2a"]
    environment:
      GYM_STYLE: norte
      GYM_A2A_URL: http://gym-norte:8000
      GYM_PUBLIC_URL: http://127.0.0.1:9101
      GYM_API_KEY: dev-gym-norte-key
    ports:
      - "127.0.0.1:9101:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  gym-sur:
    build:
      context: apps/simulated-gym-agent
    profiles: ["a2a"]
    environment:
      GYM_STYLE: sur
      GYM_A2A_URL: http://gym-sur:8000
      GYM_PUBLIC_URL: http://127.0.0.1:9102
      GYM_BEARER_TOKEN: dev-gym-sur-token
    ports:
      - "127.0.0.1:9102:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # The non-compliant one: it serves an A2A 0.3 card and nothing else. Registered on purpose, so
  # the conformance gate is seen refusing it — `GET /v1/agents` lists it `usable: false` with
  # `reason: "version_unsupported"`, and a search still answers from the other two.
  gym-legacy:
    build:
      context: apps/simulated-gym-agent
    profiles: ["a2a"]
    environment:
      GYM_STYLE: legacy
      GYM_A2A_URL: http://gym-legacy:8000
      GYM_PUBLIC_URL: http://127.0.0.1:9103
    ports:
      - "127.0.0.1:9103:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  a2a-gateway:
    build:
      context: apps/a2a-gateway
    profiles: ["a2a"]
    environment:
      # The registry (spec §3.1): one URL per trusted agent, by service name on this network. An
      # agent's id is its host, so these are gym-norte, gym-sur and gym-legacy.
      A2A_GATEWAY_AGENTS: http://gym-norte:8000,http://gym-sur:8000,http://gym-legacy:8000
      # What the orchestrator presents (ORCHESTRATOR_A2A_GATEWAY_TOKEN above).
      A2A_GATEWAY_TOKEN: dev-a2a-gateway-token
      # One credential per agent that needs one, named by its id; each gym's card says where it
      # goes (an X-Gym-Key header for norte, a bearer token for sur). Legacy needs none: it is
      # refused before a credential is looked at.
      A2A_GATEWAY_CREDENTIAL_GYM_NORTE: dev-gym-norte-key
      A2A_GATEWAY_CREDENTIAL_GYM_SUR: dev-gym-sur-token
      # Traces, off unless asked for: `A2A_GATEWAY_OTEL_ENABLED=true` with the `observability`
      # profile up. The endpoint is the collector's OTLP/HTTP base URL by service name; the gateway
      # joins `/v1/traces` itself, and names its spans `a2a-gateway`.
      A2A_GATEWAY_OTEL_ENABLED: ${A2A_GATEWAY_OTEL_ENABLED:-false}
      A2A_GATEWAY_OTEL_ENDPOINT: ${A2A_GATEWAY_OTEL_ENDPOINT:-http://otel-collector:4318}
    # 8003 on the host, beside voice's 8002.
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      # Cards are read on first use and kept for A2A_GATEWAY_CARD_TTL_SECONDS, so an agent still
      # starting when the first search arrives would be `card_unreachable` for five minutes.
      # Legacy too: the refusal the demo shows is `version_unsupported`, not a gym that was late.
      gym-norte:
        condition: service_healthy
      gym-sur:
        condition: service_healthy
      gym-legacy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # --- observability -----------------------------------------------------------------
  #
  # Four services on the `observability` profile, and nothing else references them: no
  # service outside this block depends_on one of these, and none of these depends_on a
  # service outside it. That is what makes them genuinely inert — `just app` and `just back`
  # do not resolve them, do not pull them and do not wait for them. Verify rather than trust
  # it: `docker compose config --services` with no profile must not list any of the four.
  #
  # The dependency direction is the reason it can be that clean. The orchestrator PUSHES to
  # the collector; nothing here reaches back into the application. So the stack is optional
  # at runtime as well as at startup — with the profile down, the SDK's exporter fails to
  # connect, retries and gives up, and the turn is unaffected. Telemetry that can take the
  # service down with it is worse than no telemetry.
  #
  # Separate containers rather than the grafana/otel-lgtm all-in-one image, deliberately:
  # the point is that this arrangement transfers to a real deployment, and all-in-one hides
  # exactly the seams (exporter endpoints, retention, provisioning) that have to be
  # configured there. Config lives in ops/observability/, mounted read-only.
  #
  # Every image is pinned to an exact tag. `latest` on four services is four ways for the
  # stack to break on a morning when nobody changed anything.
  #
  # Section 5 of docs/superpowers/specs/2026-08-29-orchestrator-observability-design.md.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    profiles: ["observability"]
    # contrib, not the core distribution: the prometheusremotewrite exporter is not in core.
    # Worth knowing before someone "simplifies" this to the smaller image and finds the
    # metrics pipeline refuses to load.
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      # 4317 gRPC and 4318 HTTP, the OTLP defaults, published on loopback (rule 13).
      # Published rather than left on the compose network because the orchestrator is run
      # both ways: `just back` puts it on this network (it would use http://otel-collector:4317),
      # but `just serve-orchestrator` runs it on the host, and then 127.0.0.1:4317 is the
      # only address that works. Tempo's own OTLP receiver is deliberately NOT published —
      # it is the same port number and would collide.
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      # The health_check extension. There is no `healthcheck:` below because this image is
      # distroless — no shell, no wget, nothing for docker to exec (verified: /bin/sh does
      # not exist in 0.130.0). Publishing the port is how you answer "is the collector up"
      # from the host instead: curl 127.0.0.1:13133. A Kubernetes readiness probe hits the
      # same endpoint without needing anything inside the image, which is the point.
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133"
    depends_on:
      # Both are export targets, so starting first only avoids a noisy minute of retries —
      # the collector recovers on its own either way. service_started, not service_healthy,
      # because tempo has no healthcheck (same distroless reason) and requiring one would
      # deadlock the profile.
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.1
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./ops/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      # A named volume, not a bind mount, and that is not a style preference. Tempo runs as
      # uid 10001 and /var/tempo exists in the image owned by 10001, so docker's copy-up
      # gives a fresh named volume the right ownership and tempo can write. A bind mount to
      # a host directory gets no copy-up, arrives owned by root, and tempo fails at startup
      # with a permission error that reads like a config problem. Verified on 2.8.1: wal/
      # and blocks/ come out 10001-owned.
      - tempo-data:/var/tempo
    ports:
      # Tempo's HTTP API — TraceQL queries, /ready, /status. Grafana reaches it over the
      # compose network, so this publish is for humans and for the verification in the
      # commit message: curl the API and confirm a trace is really there.
      # 3200 is Tempo's own default and is free here.
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    # No healthcheck: distroless image, nothing to exec. /ready on 3200 is the real signal
    # and a deployment's probe can reach it; docker compose just cannot.
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days. The headline number of this design — how often a rule overrode the model and
      # changed the answer — is only meaningful as a trend, and a fortnight covers "did last
      # week's change move it". Tempo keeps 72h, so exemplars older than three days lead to a
      # trace that no longer exists; see the note in ops/observability/tempo/tempo.yaml.
      - --storage.tsdb.retention.time=15d
      # The application's metrics are PUSHED here by the collector. Without this flag the
      # remote write endpoint 404s and the collector logs export failures while Prometheus
      # looks perfectly healthy — a stack that is green and receiving nothing.
      - --web.enable-remote-write-receiver
      # Exemplars are opt-in and off by default. This is the flag that makes "jump from the
      # override-rate panel to that turn's waterfall" possible at all; without it Prometheus
      # accepts the exemplars on remote write and silently discards them.
      - --enable-feature=exemplar-storage
      # Lets `curl -XPOST /-/reload` apply a scrape config change without restarting and
      # losing the in-memory head block. Defensible only because nothing here leaves
      # loopback (rule 13).
      - --web.enable-lifecycle
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Named volume for the same copy-up reason as tempo: the image owns /prometheus as
      # uid 65534 (nobody) and a bind mount would arrive root-owned.
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      # This image does have a shell and wget, so unlike tempo and the collector it can say
      # for itself whether it is ready. The collector waits on this one because a remote
      # write to a Prometheus that is still replaying its WAL is just retries.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    environment:
      # Development credentials, and only defensible because of the loopback publish below
      # (rule 13). Set explicitly rather than left at grafana's admin/admin default, which
      # triggers the change-password interstitial and makes the API verification below fail
      # in a way that looks like a provisioning fault.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Anonymous access left OFF on purpose. It would be convenient here and is the habit
      # that follows a compose file into a deployment; the login is two seconds.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # No phoning home and no update banner, matching tempo's usage_report setting.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # Read-only: this directory is the source of truth for datasources, and grafana must
      # not be able to write back over it. Datasources are also marked editable:false inside,
      # so a change made in the browser is refused rather than silently lost on recreate.
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Section 6 drops dashboard JSON in here; the provider is already pointed at it.
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 3001, NOT grafana's default 3000. 3000 belongs to the web client (`just web`, and
      # `just app` starts it), and the whole point of this stack is to be up at the same
      # time as the application it is watching. Sharing the port would mean choosing between
      # the app and the dashboard of the app.
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
  voice-models:
  # Observability state. Separate volumes so `docker volume rm finguard_tempo-data` throws
  # away traces without also throwing away the metric history or grafana's own database.
  tempo-data:
  prometheus-data:
  grafana-data:
