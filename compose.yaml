name: finguard

# Perfiles:
#   core  esqueleto: base de datos + APIs de backend
#   poc   todo lo que exista: core + piel (web, y más adelante app móvil)
#   voice / a2a / events  se añaden en sus iteraciones
#
# Un componente suelto no necesita perfil: docker compose up postgres
# Todo se publica solo en 127.0.0.1: las credenciales son de desarrollo (regla 13).

services:
  postgres:
    image: postgres:18-alpine
    profiles: ["core", "poc"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finguard}
      POSTGRES_DB: ${POSTGRES_DB:-finguard}
    # 5442 en el host: 5432 y 5433 suelen estar ocupados por otros proyectos.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      # En Postgres 18+ el volumen se monta en /var/lib/postgresql, no en .../data.
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finguard} -d ${POSTGRES_DB:-finguard}"]
      interval: 5s
      timeout: 3s
      retries: 10

  banking-api:
    build:
      context: .
      dockerfile: apps/banking-api/Dockerfile
    profiles: ["core", "poc"]
    environment:
      BANKING_DATABASE_URL: postgresql://finguard_banking:finguard_banking@postgres:5432/finguard_banking
      # Rol de solo lectura para el motor de consultas (§8.6)
      BANKING_QUERY_DATABASE_URL: postgresql://finguard_query_reader:finguard_query_reader@postgres:5432/finguard_banking
    ports:
      - "127.0.0.1:${BANKING_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  assistant-api:
    build:
      context: .
      dockerfile: apps/assistant-api/Dockerfile
    profiles: ["core", "poc"]
    environment:
      # Política de LLM por defecto al arrancar; se cambia en caliente por HTTP.
      ASSISTANT_LLM_PROVIDER: ${ASSISTANT_LLM_PROVIDER:-echo}
      ASSISTANT_LLM_MODEL: ${ASSISTANT_LLM_MODEL:-echo-1}
    ports:
      - "127.0.0.1:${ASSISTANT_PORT:-8000}:8000"
    depends_on:
      banking-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
